<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Thimble avatar — states demo</title>
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:40px;background:#1B3A32;font-family:system-ui,sans-serif;color:#F5F0E8}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
button{font:inherit;font-size:14px;font-weight:600;padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#F5F0E8;cursor:pointer}
button.on{background:#F5F0E8;color:#1B3A32}
#host{padding:60px}
small{opacity:.6}
</style>
</head>
<body>
<div id="host"></div>
<div class="row" id="states"></div>
<div class="row"><button id="mic">Use microphone for level</button></div>
<small>Without mic, a simulated voice level drives listening and speaking.</small>
<script src="thimble-avatar.js"></script>
<script>
const av = new ThimbleAvatar(document.getElementById('host'), { size: 240 });
const states = ['idle', 'listening', 'thinking', 'speaking', 'muted', 'paused'];
const bar = document.getElementById('states');
states.forEach(s => {
  const b = document.createElement('button'); b.textContent = s;
  b.onclick = () => { av.setState(s); [...bar.children].forEach(c => c.classList.toggle('on', c === b)); };
  bar.appendChild(b);
});
bar.children[1].click();

let analyser = null, buf = null;
document.getElementById('mic').onclick = async () => {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const ctx = new AudioContext(); analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser); buf = new Float32Array(analyser.fftSize);
};
setInterval(function loop() {
  let lvl;
  if (analyser) {
    analyser.getFloatTimeDomainData(buf);
    let s = 0; for (const v of buf) s += v * v;
    lvl = Math.min(1, Math.sqrt(s / buf.length) * 6);
  } else {
    const t = performance.now() / 1000;
    const syl = Math.pow(Math.max(0, Math.sin(t * 8.5)), 0.7), phrase = Math.max(0, Math.sin(t * 1.3) + 0.35);
    lvl = Math.min(1, syl * phrase);
  }
  av.setLevel(lvl);
}, 1000 / 30);
</script>
</body>
</html>
