<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Thimble: Reset</title>
<style>
  :root {
    --bg-page: #0f1412;
    --modal-bg: #f6f3ee;
    --text-primary: #192320;
    --text-secondary: #6e7672;
    --text-tertiary: #9ea5a0;
    --status-dot: #f06a85;
    --button-teal: #183935;
    --accent-amber: #d89642;
    --border-light: rgba(0,0,0,0.06);
    --thimble-pink: #FF8CA3;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  html, body {
    width: 100%;
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    background-color: var(--bg-page);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .device-shell {
    width: 100%;
    max-width: 412px;
    height: 100%;
    max-height: 892px;
    background-color: var(--modal-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }

  @media (min-width: 440px) {
    .device-shell {
      border-radius: 36px;
      height: 94dvh;
      border: 8px solid #202422;
    }
  }

  /* Status Bar */
  .system-status {
    height: 30px;
    padding: 8px 22px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.2px;
    z-index: 30;
    position: relative;
  }
  .system-icons { display: flex; align-items: center; gap: 6px; font-size: 11px; }

  /* Header */
  .app-header {
    height: 40px;
    padding: 2px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    z-index: 30;
    position: relative;
  }
  .status-cluster { display: flex; align-items: center; gap: 8px; font-size: 14.5px; font-weight: 500; color: var(--text-primary); }
  .status-dot { width: 8.5px; height: 8.5px; border-radius: 50%; background-color: var(--status-dot); animation: pulseGlow 2.4s ease-in-out infinite; }
  .status-title strong { font-weight: 700; }
  .header-actions { display: flex; align-items: center; gap: 12px; color: var(--text-secondary); }
  .header-actions svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; cursor: pointer; }

  /* Carousel progress pips live once in the fixed footer, below the title
     (see .app-footer), not per-facet -- they track the active facet,
     they don't need to rotate with the glass. */
  .facet-pips { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .pip { width: 6px; height: 6px; border-radius: 50%; transition: background 0.3s cubic-bezier(0.2, 0.9, 0.3, 1); }

  /* ---- Spindle stage: the drum fills the remaining viewport, Thimble
     sits fixed at its center and shows through each facet's open middle. ---- */
  .stage-container {
    flex: 1;
    position: relative;
    touch-action: none;
    overflow: hidden;
    perspective: 2400px;
  }

  /* The real-world rig: an octagonal glass prism around a fixed Thimble.
     overflow:hidden does not reliably clip 3D-rotated descendants (a real
     browser limitation, not a radius/sizing bug), so the other 7 panes are
     hidden with opaque covers rather than relying on clipping -- only the
     pane facing you is ever visible. The pane's own border (on .facet,
     below) is its frame, not a separate static overlay, since the frame
     has to rotate with the glass, not sit fixed over it. */
  .mask-cover {
    position: absolute; top: 0; bottom: 0; width: 11%;
    background: var(--modal-bg);
    z-index: 4;
    pointer-events: none;
  }
  .mask-cover.left { left: 0; }
  .mask-cover.right { right: 0; }

  .thimble-layer {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
    pointer-events: none;
    transition: transform .35s cubic-bezier(.3,1.2,.4,1);
  }
  /* While the picker's up, the question card and Thimble stack as ONE
     group (card above, Thimble below, touching) inside this same
     full-height, already-centered layer -- so the pair is vertically
     centered in the viewport as a single object, the way the speech
     bubble + Thimble always worked, not two independently-positioned
     pieces. */
  #stage.picker-open .thimble-layer {
    flex-direction: column;
    gap: 0;
  }
  #stage.picker-open .thimble-avatar {
    transform: scale(0.92);
    margin-top: -6px;
  }
  /* The active facet's own breath-coach/round-pill sit right where the
     question bubble sits -- hide that facet's content while the picker's
     up so the two don't visually stack. */
  #stage.picker-open .facet { visibility: hidden; }
  /* The footer's exercise name/pips are meaningless before a choice is
     made -- collapsing it hands that space to the stage (flex:1), which
     is what actually gives Thimble more room to sit lower. */
  #stage.picker-open ~ .app-footer { display: none; }
  /* Swiping between exercises isn't the point of this screen. */
  #stage.picker-open ~ .edge-nav { display: none; }

  .drum {
    position: absolute;
    inset: 0;
    transform-style: preserve-3d;
    z-index: 2;
    cursor: grab;
  }
  .drum.dragging { cursor: grabbing; }

  /* The glass itself: each facet is 100% clear -- no tint, no blur, no
     fill. Thimble is seen through it untouched. What reads as "glass" is
     just the pane's own frame: a light pink border, sized to the visible
     window (matching .mask-cover's 11% insets) so the border lands inside
     the frame, not hidden under the opaque covers at the stage edges. */
  .facet {
    position: absolute;
    top: 0; bottom: 0; left: 11%; right: 11%;
    display: flex;
    flex-direction: column;
    backface-visibility: hidden;
    pointer-events: none;
    padding: 10px 18px 14px;
  }
  .facet-eyebrow {
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--accent-amber);
  }

  /* True footer chrome: fixed below the stage (not part of the rotating
     glass), so it spans the full device width edge-to-edge instead of
     sitting inset as a floating card inside the 11%-89% glass window. */
  .app-footer {
    flex: none;
    background: var(--button-teal);
    padding: 22px 24px calc(22px + env(safe-area-inset-bottom, 0px));
    display: flex;
    flex-direction: column;
    gap: 16px;
    z-index: 25;
    position: relative;
  }
  .app-footer .footer-row { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .facet-eyebrow { color: var(--accent-amber); text-align: center; }
  .app-footer .title-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .facet-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.25; }
  .app-footer .facet-pips { margin-top: 0; }
  .app-footer .pip { background: rgba(255,255,255,0.25); }
  .app-footer .pip.active { background: var(--accent-amber); }
  .facet-info {
    flex: none; display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.7); cursor: pointer;
  }
  .facet-info svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; fill: none; }

  /* Explainer tooltip: tap the info glyph to see what the exercise does
     and why -- anchored above the footer, tail pointing down at the
     glyph, same frosted-card language as the breath-coach bubble. */
  .info-tooltip {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%) translateY(-6px);
    width: min(280px, calc(100vw - 64px));
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    padding: 14px 18px;
    border: 1px solid var(--border-light);
    box-shadow: 0 12px 28px rgba(0,0,0,0.18);
    text-align: left;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    z-index: 40;
  }
  .info-tooltip.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(-14px);
  }
  .info-tooltip::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    width: 13px;
    height: 13px;
    background: rgba(255, 255, 255, 0.96);
    border-right: 1px solid var(--border-light);
    border-bottom: 1px solid var(--border-light);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 3px 0;
    z-index: -1;
  }
  .info-tooltip-title { font-size: 13px; font-weight: 700; color: var(--text-primary); margin-bottom: 4px; }
  .info-tooltip-desc { font-size: 13px; font-weight: 500; color: var(--text-secondary); line-height: 1.4; }

  /* Breath coach: the instruction text + one-dot-per-second progress,
     shown only on facets that actually pace a breath (box breath,
     physiological sigh, the 0.1Hz RSA cycle) -- not a static "4-4-4-4"
     label, but text that changes live with which phase Thimble is in. */
  .breath-coach {
    align-self: center;
    text-align: center;
    background: rgba(255, 255, 255, 0.88);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 16px;
    padding: 7px 16px;
    border: 1px solid var(--border-light);
    box-shadow: 0 8px 24px rgba(0,0,0,0.04);
    position: relative;
  }
  /* Speech-bubble tail pointing down at Thimble: a rotated square tucked
     half behind the card's bottom edge, sharing its fill/border so the
     border traces seamlessly from card into tail. */
  .breath-coach::after {
    content: "";
    position: absolute;
    bottom: -6px;
    left: 50%;
    width: 13px;
    height: 13px;
    background: rgba(255, 255, 255, 0.88);
    border-right: 1px solid var(--border-light);
    border-bottom: 1px solid var(--border-light);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 3px 0;
    z-index: -1;
  }
  .breath-instruction { font-size: 15px; font-weight: 700; color: var(--text-primary); }
  .breath-instruction .suffix { font-weight: 500; color: var(--text-secondary); }
  .breath-dots { display: flex; justify-content: center; gap: 6px; margin-top: 8px; }
  .breath-dots .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-light); background-color: rgba(0,0,0,0.12); transition: background-color 0.15s ease, transform 0.15s ease; }
  .breath-dots .dot.filled { background-color: var(--accent-amber); transform: scale(1.1); }

  /* Round pill: "2 left" above the breath-coach bubble, only on facets
     that declare maxRounds. Sits as its own floating chip rather than
     inside the bubble, so it doesn't push the bubble's own padding/width
     around as the digit count changes between "4" and "1". */
  .round-pill {
    align-self: center;
    font-size: 11px; font-weight: 700; color: #fff;
    background: var(--button-teal);
    padding: 5px 12px; border-radius: 20px;
    letter-spacing: 0.2px;
    margin-bottom: 8px;
  }

  /* Stop state: replaces the breath-coach bubble in place once maxRounds
     is reached -- same slot, one pill button, no card. The same button
     plays the first run and replays every run after, so its state is just
     its label/icon swapping between "Play" and "Replay" -- never two
     separate controls. */
  .round-replay {
    align-self: center;
    display: flex; align-items: center; gap: 7px;
    background: var(--button-teal); color: #fff;
    font-size: 13px; font-weight: 700;
    padding: 10px 20px; border-radius: 24px;
    border: none; cursor: pointer; pointer-events: auto;
    box-shadow: 0 8px 20px rgba(24,57,53,0.22);
  }
  .round-replay[hidden] { display: none; }
  .round-replay:active { transform: scale(0.96); }
  .round-replay svg { width: 14px; height: 14px; fill: currentColor; flex: none; }

  /* State picker: Thimble asks this himself -- no modal over him. The
     stage background stays transparent so Thimble (pushed down, see
     above) is visible below the one dialog card; only the card itself
     is actually painted. */
  .state-picker {
    display: none;
    width: 100%;
    justify-content: center;
    padding: 0 18px 14px;
    pointer-events: none;
    transition: opacity .3s ease, visibility .3s ease;
  }
  #stage.picker-open .state-picker { display: flex; }
  .state-picker.hidden { opacity: 0; visibility: hidden; }
  /* One dialog: question and both answers live in the same white card,
     not a bubble plus two separate floating buttons. */
  .picker-card {
    width: 100%; max-width: 300px;
    background: #fff;
    border-radius: 20px;
    padding: 20px 16px 16px;
    border: 1px solid var(--border-light);
    box-shadow: 0 10px 28px rgba(0,0,0,0.07);
    display: flex; flex-direction: column; gap: 14px;
    pointer-events: auto;
    position: relative;
  }
  /* Same speech-bubble tail trick as .breath-coach: a rotated square
     tucked half behind the card's bottom edge, sharing its fill/border so
     it traces seamlessly out of the card, pointing down at Thimble. */
  .picker-card::after {
    content: "";
    position: absolute;
    bottom: -7px;
    left: 50%;
    width: 15px; height: 15px;
    background: #fff;
    border-right: 1px solid var(--border-light);
    border-bottom: 1px solid var(--border-light);
    transform: translateX(-50%) rotate(45deg);
    border-radius: 0 0 3px 0;
  }
  .picker-question {
    font-size: 15px; font-weight: 700; color: var(--text-primary);
    text-align: center; line-height: 1.4;
  }
  .picker-options { display: flex; gap: 10px; }
  .picker-option {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 14px; background: var(--button-teal); border: none;
    padding: 14px 10px; font-size: 15px; font-weight: 700; color: #fff;
    cursor: pointer; transition: transform .12s ease, opacity .12s ease;
  }
  .picker-option:active { transform: scale(0.96); opacity: 0.85; }

  /* ---- Thimble: the real avatar shape (ported from session.html's
     thimble-avatar / thimble-core / thimble-ring / thimble-body chain),
     not a drawn sewing-thimble dome. ---- */
  .thimble-avatar { position: relative; width: 268px; height: 268px; pointer-events: none; }
  .thimble-shadow {
    position: absolute; left: 50%; top: calc(100% + 10px); width: 66%; height: 12px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse closest-side at center, rgba(23,55,46,.34) 0%, rgba(23,55,46,.2) 50%, rgba(23,55,46,.07) 78%, rgba(23,55,46,0) 100%);
    border-radius: 50%;
  }
  .thimble-core { position: absolute; inset: 0; transition: transform .5s cubic-bezier(.3,1.4,.5,1); }
  /* The real app's idle/listening shape: a subtle egg (not a perfect
     circle), paired with a lean tilt -- never the old wild border-radius
     "blob" keyframe, which is dead/unused CSS in session.html (its own
     comment: "No CSS blob anymore"). */
  .thimble-ring { position: absolute; inset: 0; border-radius: 50% 50% 48% 52% / 58% 58% 42% 42%; }
  /* "Four-Color Bloom" fill, ported from session.html's real resting
     (idle-weighted) blend: idle-blue/listening-teal/thinking-honey/
     talking-pink all live at fixed corners all the time, not one flat
     color -- this is the idle-state weighting (idle 46%, its two
     neighbors 20% each, talking 14%), computed once since this prototype
     has no listening/thinking/talking states to lerp toward. */
  .thimble-body {
    position: absolute; inset: 0; border-radius: inherit;
    background-color: rgb(191, 192, 186);
    background-image:
      radial-gradient(circle at 15% 15%, rgba(255,255,255,.7) 0%, transparent 16%),
      radial-gradient(circle at 15% 15%, rgba(163,207,224,.81) 0%, transparent 66.6%),
      radial-gradient(circle at 85% 15%, rgba(176,222,209,.52) 0%, transparent 38%),
      radial-gradient(circle at 80% 85%, rgba(233,185,73,.45) 0%, transparent 31.4%),
      radial-gradient(circle at 20% 85%, rgba(243,130,154,.52) 0%, transparent 38%);
    box-shadow:
      inset -15px -17px 20px -10px rgba(0,0,0,.22),
      inset 10.5px 11.9px 18px -10px rgba(255,255,255,.35);
    overflow: hidden;
    animation: thimble-idle-bounce 2.6s ease-in-out infinite;
  }
  .thimble-blend {
    position: absolute; width: 80%; height: 80%; left: -38%; top: 30%; border-radius: 50%;
    background: #E9B949; mix-blend-mode: multiply; opacity: 0; transition: opacity .8s ease;
  }

  @keyframes thimble-idle-bounce {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-5%); }
  }

  /* Real app's mouth fill is a light cream (#F6F1E7), not a dark cavity --
     a solid dark fill read as a void/orifice rather than a mouth. */
  .thimble-mouth {
    position: absolute; left: 50%; top: 66%;
    transform: translate(-50%, -50%);
    background: #F6F1E7;
    border-radius: 50%;
    transition: background .4s ease;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .thimble-eye {
    height: 130%; aspect-ratio: 1 / 1; border-radius: 50%;
    flex: none;
    background: #ffffff;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transform: scale(.5);
    transition: opacity .35s ease, transform .35s ease;
  }
  .thimble-pupil {
    width: 42%; height: 42%; border-radius: 50%; background: #A9B8A8;
  }
  .thimble-eye.visible { opacity: 1; transform: scale(1); }

  /* The two alternating nodes for Bilateral Thumb Tap -- each one lights
     up in turn on the side you should be tapping, Thimble himself rocks
     gently toward whichever one is lit. */
  .tap-dot {
    position: absolute; left: 50%; top: 50%;
    width: 18px; height: 18px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffb3c2, #ff6f8f 60%, #e2506f 100%);
    box-shadow: 0 2px 6px rgba(226, 80, 111, .35);
    opacity: 0;
    pointer-events: none;
  }

  /* The sweeping node Thimble's eye tracks during Bilateral Saccades. */
  .saccade-ball {
    position: absolute; left: 50%; top: 50%;
    width: 16px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #ffcf8a, #f0872c 60%, #d9661f 100%);
    box-shadow: 0 2px 6px rgba(166, 82, 23, .4);
    transform: translate(-50%, -50%) translate(0, 90px);
    opacity: 0;
    transition: opacity .4s ease;
  }
  .saccade-ball.visible { opacity: 1; }

  /* Nose-breathing: the mouth hides and two small nostril holes take over
     at the same spot, sized with the breath so inhale/exhale reads at the
     nostrils instead of the mouth -- swapped back to the mouth the moment
     the phase calls for breathing out through it. */
  .thimble-nostrils {
    position: absolute; left: 50%; top: 52%;
    transform: translate(-50%, -50%);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    opacity: 0; transition: opacity .25s ease;
  }
  .thimble-nostrils.visible { opacity: 1; }
  .thimble-nostril {
    width: 7px; height: 7px; border-radius: 50%;
    background: #ffffff; opacity: .85;
    transition: transform .15s ease;
  }

  /* Plain glyph, no button pill -- a bare arrow reads closer to the
     wireframe's minimal chrome than a floating circular control. */
  .edge-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    display: flex; align-items: center; justify-content: center;
    color: var(--text-secondary);
    cursor: pointer; z-index: 20;
    transition: color 0.15s ease, transform 0.15s ease;
  }
  .edge-nav:active { transform: translateY(-50%) scale(0.88); color: var(--text-primary); }
  .edge-nav.prev { left: 14px; }
  .edge-nav.next { right: 14px; }
  .edge-nav svg { width: 22px; height: 22px; stroke: currentColor; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); opacity: 0.9; }
    50% { transform: scale(1.22); opacity: 0.55; }
  }
</style>
</head>
<body>

<div class="device-shell">
  <!-- System Status Bar -->
  <div class="system-status">
    <span>11:12 PM</span>
    <div class="system-icons"><span>●</span><span>📶</span><span>54%</span></div>
  </div>

  <!-- Header -->
  <div class="app-header">
    <div class="status-cluster">
      <div class="status-dot"></div>
      <div class="status-title"><strong>Thimble</strong></div>
    </div>
    <div class="header-actions">
      <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
    </div>
  </div>

  <!-- Spindle Stage -->
  <div class="stage-container picker-open" id="stage">
    <div class="thimble-layer">
      <!-- State picker: Thimble asks this himself. Lives inside the same
           layer as his avatar so the question card and Thimble stack and
           center together as one object, not two separately positioned
           pieces. Tapping an option settles the drum straight to that
           facet and fades the picker out -- this is the self-reported
           routing step, not a separate screen. -->
      <div class="state-picker" id="statePicker">
        <div class="picker-card">
          <div class="picker-question">Do you want help calming your</div>
          <div class="picker-options">
            <div class="picker-option" data-facet="0">Body</div>
            <div class="picker-option" data-facet="3">Mind</div>
          </div>
        </div>
      </div>
      <div class="thimble-avatar" id="thimbleAvatar">
        <div class="thimble-shadow"></div>
        <div class="thimble-core" id="thimbleCore">
          <div class="thimble-ring">
            <div class="thimble-body">
              <div class="thimble-blend"></div>
              <div class="thimble-mouth" id="thimbleMouth">
                <div class="thimble-eye" id="thimbleEye"><div class="thimble-pupil" id="thimblePupil"></div></div>
              </div>
              <div class="thimble-nostrils" id="thimbleNostrils">
                <div class="thimble-nostril" id="nostrilLeft"></div>
                <div class="thimble-nostril" id="nostrilRight"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="saccade-ball" id="saccadeBall"></div>
      <div class="tap-dot" id="tapDotLeft"></div>
      <div class="tap-dot" id="tapDotRight"></div>
    </div>
    <div class="drum" id="drum"></div>
    <div class="mask-cover left"></div>
    <div class="mask-cover right"></div>
  </div>

  <!-- Fixed footer: title/category for the active facet, full device width -->
  <div class="app-footer">
    <div class="footer-row">
      <div class="facet-eyebrow" id="footerEyebrow"></div>
      <div class="title-row">
        <div class="facet-title" id="footerTitle"></div>
        <div class="facet-info" id="footerInfo" title="Learn more about this exercise">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
        </div>
      </div>
    </div>
    <div class="facet-pips" id="footerPips"></div>
    <div class="info-tooltip" id="infoTooltip">
      <div class="info-tooltip-title" id="infoTooltipTitle"></div>
      <div class="info-tooltip-desc" id="infoTooltipDesc"></div>
    </div>
  </div>

  <div class="edge-nav prev" id="prevBtn" title="Previous facet">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
  </div>
  <div class="edge-nav next" id="nextBtn" title="Next facet">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
  </div>
</div>

<script>
// --- 8 SOMATIC NERVOUS SYSTEM PROTOCOLS ---
// Each facet carries: its own window-frame copy (rendered on the rotating
// facet), plus how Thimble itself should breathe/move while it's front-facing
// (breathe = inhale amount 0..1 driving body scale + mouth openness,
// readout = optional count/phase text, eye = whether the mouth shows an
// eyeball instead of just opening, accent = optional canvas overlay near
// Thimble for exercises that aren't breath-shaped).
const FACETS = [
  {
    category: "Somatic Brake", name: "Box Breath Metronome", state: "4-4-4-4 Pacing",
    desc: "4s Inhale · 4s Hold · 4s Exhale · 4s Hold. Lowers cardiac excitation baseline.",
    eye: false,
    maxRounds: 4, roundSeconds: 16,
    breathe(t) {
      const cycle = t % 16, seg = Math.floor(cycle / 4), local = cycle % 4;
      const segs = [
        { instruction: "Breathe in", suffix: "through your nose", nostril: true },
        { instruction: "Hold", suffix: "", nostril: true },
        { instruction: "Breathe out", suffix: "through your mouth", nostril: true },
        { instruction: "Hold", suffix: "", nostril: true },
      ];
      let inhale;
      if (seg === 0) inhale = local / 4;
      else if (seg === 1) inhale = 1;
      else if (seg === 2) inhale = 1 - local / 4;
      else inhale = 0;
      return { inhale, ...segs[seg], seconds: 4, elapsed: local };
    }
  },
  {
    category: "Acute Adrenaline Dump", name: "Physiological Sigh", state: "Double-In, Long-Out",
    desc: "Two rapid nasal inhales + one extended oral sigh to re-inflate collapsed alveoli.",
    eye: false,
    maxRounds: 3, roundSeconds: 6.6,
    breathe(t) {
      // A continuous wave, not two independent ramps: the nose opens and
      // closes as the chest fills, then the mouth opens and closes as it
      // empties -- each phase its own smooth bump, never an abrupt cut.
      const noseDur = 2.0, mouthDur = 4.6, total = noseDur + mouthDur;
      const cycle = t % total;
      if (cycle < noseDur) {
        const p = cycle / noseDur;
        const inhale = Math.sin(Math.PI / 2 * p); // rises 0 -> 1 as the nose breath fills
        const nostrilEnv = Math.sin(Math.PI * p); // opens then closes
        return { inhale, instruction: "Breathe in", suffix: "through your nose", seconds: noseDur, elapsed: cycle, nostril: true, nostrilEnv };
      }
      const p = (cycle - noseDur) / mouthDur;
      const inhale = Math.cos(Math.PI / 2 * p); // falls 1 -> 0 as the sigh empties
      const mouthEnv = Math.sin(Math.PI * p); // opens then closes
      return { inhale, instruction: "Breathe out", suffix: "through your mouth", seconds: mouthDur, elapsed: cycle - noseDur, nostril: false, mouthOpen: mouthEnv * 0.65 };
    }
  },
  {
    category: "Breaking Visual Tunnel", name: "Bilateral Saccades", state: "Tracking Sweep",
    desc: "Follow the sweeping node left-to-right to desensitize acute amygdala threat locks.",
    cue: "Follow the dot back and forth with your eyes",
    eye: true,
    // Thimble's own eye tracks the sweep -- no separate dot overlay.
    breathe(t) { return { inhale: 0.3 + Math.sin(t * 0.6) * 0.08, eyeX: Math.sin(t * 2.8) }; }
  },
  {
    category: "Motor Rhythm Anchor", name: "Bilateral Thumb Tap", state: "Alternating L / R",
    desc: "Alternating dual-pad rhythm grounds cognitive loops through somatic motor circuits.",
    cue: "Tap in time with the lit side, alternating left and right",
    eye: false,
    // Two dots either side of Thimble light up in turn, one full L/R cycle
    // every 1.12s; Thimble himself rocks a little toward whichever is lit.
    breathe(t) {
      const halfPeriod = 0.56, period = halfPeriod * 2;
      const cycle = t % period;
      const side = cycle < halfPeriod ? "left" : "right";
      const local = side === "left" ? cycle : cycle - halfPeriod;
      const env = Math.sin(Math.PI * (local / halfPeriod)); // 0 -> 1 -> 0 within that side's window
      return { inhale: 0.3 + Math.sin(t * 0.6) * 0.08, tapSide: side, tapEnv: env };
    }
  },
  {
    category: "Trigeminal Unclench", name: "Masseter Release", state: "Jaw Drop",
    desc: "Drop the tongue from roof of mouth. Slacken back molars to disarm clench reflex.",
    cue: "Let your jaw drop and your tongue rest low",
    eye: false,
    breathe(t) { return { inhale: 0.2 + 0.1 * Math.sin(t * 0.5), jawDrop: (Math.sin(t * 1.1) + 1) * 0.5 }; }
  },
  {
    category: "Peripheral Expansion", name: "Panoramic Horizon", state: "Soft Focus",
    desc: "Soften focus to perceive room boundaries without moving gaze. Disables sympathetic focus.",
    cue: "Soften your gaze and take in the whole room",
    eye: true,
    // Thimble himself widens (a gentle horizontal stretch) instead of
    // drawing separate peripheral-marker dots beside him.
    breathe(t) { return { inhale: 0.3 + Math.sin(t * 0.4) * 0.05, widen: (Math.sin(t * 1.2) + 1) * 0.5 }; }
  },
  {
    category: "Cardiac Entrainment", name: "Sternum Hold", state: "60bpm Bone Conduction",
    desc: "Rest phone against breastbone. Bone-conducted 60bpm pulse entrains heart rate deceleration.",
    cue: "Rest your phone against your chest",
    eye: false,
    // The 60bpm beat already drives inhale (body scale) directly -- that
    // pulse *is* Thimble doing the exercise, no separate chest glow needed.
    breathe(t) { return { inhale: 0.28 + Math.pow(Math.sin(t * Math.PI), 8) * 0.12 }; }
  },
  {
    category: "Vagal Brake", name: "0.1 Hz RSA Cycle", state: "4-In / 6-Out",
    desc: "Inhale 4s, exhale 6s (~6bpm). Directly drives respiratory sinus arrhythmia amplitude.",
    eye: false,
    maxRounds: 9, roundSeconds: 10,
    breathe(t) {
      const cycle = t % 10, isInhale = cycle < 4;
      const inhale = isInhale ? cycle / 4 : 1 - (cycle - 4) / 6;
      return isInhale
        ? { inhale, instruction: "Breathe in", suffix: "through your nose", seconds: 4, elapsed: cycle, nostril: true }
        : { inhale, instruction: "Breathe out", suffix: "through your mouth", seconds: 6, elapsed: cycle - 4, nostril: true };
    }
  }
];

const drum = document.getElementById("drum");
const stage = document.getElementById("stage");
const thimbleCore = document.getElementById("thimbleCore");
const thimbleMouth = document.getElementById("thimbleMouth");
const thimbleEye = document.getElementById("thimbleEye");
const thimblePupil = document.getElementById("thimblePupil");
const thimbleNostrils = document.getElementById("thimbleNostrils");
const nostrilLeft = document.getElementById("nostrilLeft");
const nostrilRight = document.getElementById("nostrilRight");
const saccadeBall = document.getElementById("saccadeBall");
const footerEyebrow = document.getElementById("footerEyebrow");
const footerTitle = document.getElementById("footerTitle");
const footerInfo = document.getElementById("footerInfo");
const infoTooltip = document.getElementById("infoTooltip");
const infoTooltipTitle = document.getElementById("infoTooltipTitle");
const infoTooltipDesc = document.getElementById("infoTooltipDesc");
const tapDotLeft = document.getElementById("tapDotLeft");
const tapDotRight = document.getElementById("tapDotRight");

const count = FACETS.length;
const step = 360 / count;
let radius = 240;
let currentAngle = 0;
let activeFacet = 0;
let dragStartX = null, dragStartAngle = 0;
let startTime = performance.now();

// Build facets (window frames) on the drum
FACETS.forEach((f, i) => {
  const el = document.createElement("div");
  el.className = "facet";
  el.style.transform = `rotateY(${-i * step}deg) translateZ(${-radius}px)`;
  const paced = f.breathe(0).instruction != null;
  // Every facet gets an instruction, paced breaths get live phase text +
  // dot progress; the rest (eye tracking, taps, jaw release, etc.) get a
  // static cue instead of sitting blank where the coach would be.
  el.innerHTML = `
    ${f.maxRounds ? '<div class="round-pill" hidden></div>' : ""}
    <div class="breath-coach" ${paced || f.cue ? "" : "hidden"}>
      <div class="breath-instruction"><span class="verb">${paced ? "" : (f.cue || "")}</span> <span class="suffix"></span></div>
      <div class="breath-dots" ${paced ? "" : "hidden"}></div>
    </div>
    ${f.maxRounds ? `<button class="round-replay" hidden>
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span>Replay</span>
    </button>` : ""}`;
  drum.appendChild(el);
});

// Round limit: only facets with maxRounds track this -- one button, always
// labeled "Replay" here since it only ever appears after a full run (tap
// resets startTime, which the render loop reads to restart the count).
drum.addEventListener("click", (e) => {
  const btn = e.target.closest(".round-replay");
  if (!btn) return;
  e.stopPropagation();
  startTime = performance.now();
});

// Progress pips now live once in the fixed footer (not rotating with the
// glass), under the title, so they read against the footer's dark bg.
const footerPips = document.getElementById("footerPips");
footerPips.innerHTML = FACETS.map((_, j) => `<div class="pip ${j === 0 ? "active" : ""}" data-i="${j}"></div>`).join("");
footerPips.querySelectorAll(".pip").forEach(p => {
  p.style.cursor = "pointer";
  p.onclick = () => settleTo(Number(p.dataset.i) * step);
});

const PERSPECTIVE = 2400; // must match .stage-container's CSS perspective
let edgeOffset = 150; // how far the tap dots / saccade ball travel from center, kept inside the visible glass by sizeDrum()

function sizeDrum() {
  const rect = stage.getBoundingClientRect();
  radius = Math.round((rect.width / 2) / Math.tan(Math.PI / count));
  // Visible glass is the stage width minus the two 11% mask-cover columns
  // (the same columns the nav arrows sit in) -- cap how far the tap dots
  // and saccade ball travel so they never slide out under those columns.
  edgeOffset = Math.min(150, rect.width * 0.39 - 18);
  // Each facet sits translateZ(-radius) behind the screen plane in its own
  // local frame, so the ring reads at viewport scale; a deep perspective
  // keeps that shrink small without over-enlarging the neighbors poking
  // in at the edges (over-compensating made them bleed into view).
  const compensate = (PERSPECTIVE + radius) / PERSPECTIVE;
  [...drum.children].forEach((el, i) => {
    el.style.transform = `rotateY(${-i * step}deg) translateZ(${-radius}px) scale(${compensate})`;
  });
}
window.addEventListener("resize", sizeDrum);
sizeDrum();

function applyRotation(angle, withTransition) {
  drum.style.transition = withTransition ? "transform .45s cubic-bezier(.2,.8,.2,1)" : "none";
  drum.style.transform = `rotateY(${angle}deg)`;
}

function setActive(i) {
  activeFacet = i;
  [...footerPips.children].forEach((d, idx) => d.classList.toggle("active", idx === i));
  thimbleEye.classList.toggle("visible", !!FACETS[i].eye);
  footerEyebrow.textContent = `${i + 1}/${count} · ${FACETS[i].category}`;
  footerTitle.textContent = FACETS[i].name;
  infoTooltipTitle.textContent = FACETS[i].name;
  infoTooltipDesc.textContent = FACETS[i].desc;
  closeTooltip();
  startTime = performance.now();
}

// Tap the info glyph for a plain-language explainer of what the active
// exercise is and why it works; tap again, pick a new facet, or tap
// anywhere else on the page to close it.
function closeTooltip() { infoTooltip.classList.remove("visible"); }
footerInfo.addEventListener("click", (e) => {
  e.stopPropagation();
  infoTooltip.classList.toggle("visible");
});
document.addEventListener("click", closeTooltip);

function settleTo(angle) {
  const idx = (((Math.round(angle / step) % count) + count) % count);
  currentAngle = idx * step;
  applyRotation(currentAngle, true);
  if (idx !== activeFacet) setActive(idx);
  if (navigator.vibrate) navigator.vibrate(16);
}

applyRotation(currentAngle, false);
setActive(0);

// State picker: Thimble asks on load, shrunk to leave room for his own
// question. Tapping "Body" or "Mind" settles the drum straight to that
// facet (no transition animation -- it should feel like landing there,
// not scrolling past everything between), fades the question out, and
// grows Thimble back to full size.
const statePicker = document.getElementById("statePicker");
statePicker.querySelectorAll(".picker-option").forEach(opt => {
  opt.addEventListener("click", () => {
    const idx = Number(opt.dataset.facet);
    currentAngle = idx * step;
    applyRotation(currentAngle, false);
    setActive(idx);
    statePicker.classList.add("hidden");
    stage.classList.remove("picker-open");
  });
});

function onDown(x) { dragStartX = x; dragStartAngle = currentAngle; drum.classList.add("dragging"); }
function onMove(x) { if (dragStartX === null) return; applyRotation(dragStartAngle - (x - dragStartX) * 0.35, false); }
function onUp(x) { if (dragStartX === null) return; const a = dragStartAngle - (x - dragStartX) * 0.35; dragStartX = null; drum.classList.remove("dragging"); settleTo(a); }

stage.addEventListener("mousedown", e => onDown(e.clientX));
window.addEventListener("mousemove", e => onMove(e.clientX));
window.addEventListener("mouseup", e => onUp(e.clientX));
stage.addEventListener("touchstart", e => onDown(e.touches[0].clientX), { passive: true });
stage.addEventListener("touchmove", e => onMove(e.touches[0].clientX), { passive: true });
stage.addEventListener("touchend", e => onUp(e.changedTouches[0].clientX));

document.getElementById("prevBtn").addEventListener("click", () => settleTo(currentAngle - step));
document.getElementById("nextBtn").addEventListener("click", () => settleTo(currentAngle + step));

// --- Thimble's per-frame motion: he performs every exercise himself,
// not a separate canvas overlay beside him. ---
function render(now) {
  let t = (now - startTime) * 0.001;
  const f = FACETS[activeFacet];
  const pickerOpen = stage.classList.contains("picker-open");
  const facetEl = drum.children[activeFacet];
  const pillEl = facetEl.querySelector(".round-pill");
  const replayEl = facetEl.querySelector(".round-replay");

  if (!pickerOpen && f.maxRounds) {
    const stopAt = f.maxRounds * f.roundSeconds;
    const stopped = t >= stopAt;
    if (stopped) {
      t = stopAt - 0.001; // freeze Thimble's pose at the last breath instead of snapping to t=0
      facetEl.querySelector(".breath-coach").hidden = true;
      pillEl.hidden = true;
      replayEl.hidden = false;
    } else {
      const round = Math.floor(t / f.roundSeconds) + 1;
      const left = f.maxRounds - round + 1;
      facetEl.querySelector(".breath-coach").hidden = false;
      pillEl.hidden = false;
      pillEl.textContent = `${left} left`;
      replayEl.hidden = true;
    }
  }

  // While the picker's up, Thimble just rests -- a plain closed mouth and
  // the CSS idle-bounce (already always running on .thimble-body), not
  // whatever the active facet (Box Breath, by default) would otherwise be
  // doing to his mouth/scale/nostrils behind the question.
  const b = pickerOpen ? { inhale: 0 } : f.breathe(t);

  // Body scale + mouth openness both ride the same inhale value, so
  // Thimble's whole shape (not just a generic pulse) traces the pattern.
  // tap rocks him side to side; widen stretches him horizontally -- both
  // layer on top of the same base transform.
  const scale = 0.86 + b.inhale * 0.22;
  const tapX = b.tapSide ? (b.tapSide === "left" ? -1 : 1) * (b.tapEnv ?? 0) * 6 : 0;
  const scaleX = scale * (1 + (b.widen ?? 0) * 0.05 + b.inhale * 0.025);
  thimbleCore.style.transform = `translate(calc(2% + ${tapX}px),1%) scale(${scaleX}, ${scale})`;

  const jaw = b.jawDrop ?? 0;
  // When Thimble's mouth is carrying an eye instead of just breathing, hold
  // it open wide enough for the eye to actually read, rather than following
  // the (often thin) breath-driven openness.
  const mouthOpen = f.eye ? 0.75 : (b.mouthOpen ?? Math.max(b.inhale * 0.5, jaw));
  let w, h;
  if (f.eye) {
    // An eye reads as an eye only if its socket is a wide, flattened
    // almond, not the mouth's round-ish opening.
    w = 56; h = 24;
  } else {
    w = 29 + mouthOpen * 9.5;
    h = 10 + mouthOpen * 32;
  }
  thimbleMouth.style.width = w + "px";
  thimbleMouth.style.height = h + "px";
  thimbleMouth.style.borderRadius = f.eye ? "50%" : (h > 24 ? "46%" : "50%");

  // Nose-breathing: hide the mouth and flare two small nostril holes at
  // the same spot instead, sized with the same inhale value, so airflow
  // reads at the nostrils during a nose phase and at the mouth otherwise.
  thimbleMouth.style.opacity = b.nostril ? 0 : 1;
  thimbleNostrils.classList.toggle("visible", !!b.nostril);
  if (b.nostril) {
    const flare = 0.55 + (b.nostrilEnv ?? b.inhale) * 0.9;
    nostrilLeft.style.transform = `scale(${flare})`;
    nostrilRight.style.transform = `scale(${flare})`;
  }

  // The eye tracks a sweep (saccades) when the facet says so; otherwise
  // leave it to the .visible class's own centered scale-in.
  // The white eyeball drifts a little with the pupil (not the full
  // distance) so it reads as the eye following the ball, while the
  // pupil leads with the larger share of the motion -- not the eyeball
  // sliding rigidly as one flat disc.
  if (b.eyeX != null) {
    thimbleEye.style.transform = `translateX(${b.eyeX * 4}px) scale(1)`;
    thimblePupil.style.transform = `translateX(${b.eyeX * 7}px)`;
  } else {
    thimbleEye.style.transform = "";
    thimblePupil.style.transform = "";
  }

  // The orange node Thimble's eye tracks, swept wide across the stage
  // so the eye's small in-socket shift reads as genuine tracking.
  saccadeBall.classList.toggle("visible", b.eyeX != null);
  if (b.eyeX != null) {
    saccadeBall.style.transform = `translate(-50%, -50%) translate(${b.eyeX * edgeOffset * 0.733}px, 90px)`;
  }

  // Bilateral tap dots: whichever side is "on" scales up and brightens,
  // the other stays dim -- the alternation itself is the metronome, no
  // separate countdown or label needed.
  if (b.tapSide) {
    const env = b.tapEnv ?? 0;
    const leftOn = b.tapSide === "left";
    tapDotLeft.style.transform = `translate(calc(-50% - ${edgeOffset}px), -50%) scale(${leftOn ? 0.8 + env * 0.6 : 0.75})`;
    tapDotLeft.style.opacity = leftOn ? 0.5 + env * 0.5 : 0.3;
    tapDotRight.style.transform = `translate(calc(-50% + ${edgeOffset}px), -50%) scale(${!leftOn ? 0.8 + env * 0.6 : 0.75})`;
    tapDotRight.style.opacity = !leftOn ? 0.5 + env * 0.5 : 0.3;
  } else {
    tapDotLeft.style.opacity = 0;
    tapDotRight.style.opacity = 0;
  }

  if (b.instruction != null) {
    const coach = drum.children[activeFacet].querySelector(".breath-coach");
    coach.querySelector(".verb").textContent = b.instruction;
    coach.querySelector(".suffix").textContent = b.suffix || "";

    const dotCount = Math.round(b.seconds);
    const filled = Math.min(dotCount, Math.floor(b.elapsed) + 1);
    const dotsEl = coach.querySelector(".breath-dots");
    if (dotsEl.childElementCount !== dotCount) {
      dotsEl.innerHTML = Array.from({ length: dotCount }, () => '<span class="dot"></span>').join("");
    }
    [...dotsEl.children].forEach((d, i) => d.classList.toggle("filled", i < filled));
  }

  requestAnimationFrame(render);
}
requestAnimationFrame(render);
</script>
</body>
</html>
