# Render blueprint for the MVP test deploy: demo-app + Thimble behind
# Caddy, one container, mirroring run_all.sh's path-prefix scheme for local
# dev (see Caddyfile's own "production note"). Deploy: connect this repo in
# the Render dashboard -> New -> Blueprint, or `render blueprint launch`.
services:
  - type: web
    name: mend-mvp
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    plan: starter
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ORG_ACCESS_CODE
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
