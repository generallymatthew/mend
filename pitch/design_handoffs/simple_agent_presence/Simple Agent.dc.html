<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body><a id="mend-launchpad-badge" href="../../../launchpad.html" target="_blank" rel="noopener" style="position:fixed;bottom:14px;right:14px;z-index:99999;font-family:'Manrope',-apple-system,sans-serif;font-size:11px;font-weight:600;color:#fff;background:#17372E;text-decoration:none;padding:6px 12px;border-radius:999px;opacity:.72;box-shadow:0 2px 6px rgba(0,0,0,.15);" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=.72">&#8962; Launchpad</a>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>body{margin:0;background:#f1f0ea;font-family:'Instrument Sans',sans-serif;color:#23302b}a{color:#3f6b5e}a:hover{color:#2c4d43}</style>
</helmet>
<div style="max-width:1100px;margin:0 auto;padding:48px 32px 64px;display:flex;flex-direction:column;gap:40px">
  <div style="display:flex;flex-direction:column;gap:6px">
    <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#5c6b65">Simple agent · circle + mouth</div>
    <div style="font-size:28px;font-weight:600">Five states with only a circle and a mouth</div>
    <div style="font-size:15px;color:#4a5752;max-width:640px;text-wrap:pretty">Each state uses a different channel: mouth shape, mouth position, circle scale, tempo and a small shift in green. No eyes, no icons.</div>
  </div>

  <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;background:#e9e8e0;border-radius:20px;padding:40px">
    <div style="display:flex;justify-content:center">
      <svg viewBox="0 0 200 200" style="width:100%;max-width:320px;overflow:visible">
        <circle ref="{{ hC }}" cx="100" cy="100" r="80" fill="#3f6b5e"></circle>
        <path ref="{{ hM }}" d="M72 130A28 3 0 1 0 128 130A28 3 0 1 0 72 130Z" fill="#f3f1e8"></path>
      </svg>
    </div>
    <div style="display:flex;flex-direction:column;gap:20px">
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <sc-for list="{{ buttons }}" as="b" hint-placeholder-count="5">
          <button onClick="{{ b.onClick }}" style="font:inherit;font-size:14px;padding:9px 16px;border-radius:999px;border:1px solid #c9cbc0;cursor:pointer;background:{{ b.bg }};color:{{ b.fg }}">{{ b.label }}</button>
        </sc-for>
      </div>
      <div style="font-size:22px;font-weight:600">{{ cur.label }}</div>
      <div style="font-size:15px;line-height:1.55;color:#3d4a45;text-wrap:pretty">{{ cur.desc }}</div>
      <label style="display:flex;gap:8px;align-items:center;font-size:14px;color:#5c6b65;cursor:pointer">
        <input type="checkbox" checked="{{ auto }}" onChange="{{ toggleAuto }}">
        Auto-cycle states
      </label>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px">
    <sc-for list="{{ cards }}" as="c" hint-placeholder-count="5">
      <div style="background:#e9e8e0;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:12px">
        <svg viewBox="0 0 200 200" style="width:100%;max-width:150px;align-self:center;overflow:visible">
          <circle ref="{{ c.rc }}" cx="100" cy="100" r="80" fill="#3f6b5e"></circle>
          <path ref="{{ c.rm }}" d="M72 130A28 3 0 1 0 128 130A28 3 0 1 0 72 130Z" fill="#f3f1e8"></path>
        </svg>
        <div style="font-size:15px;font-weight:600">{{ c.label }}</div>
        <div style="font-size:13px;line-height:1.5;color:#4a5752;text-wrap:pretty">{{ c.short }}</div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const STATES=[
 {label:'Listening',short:'Flat oval at rest. Breathes slowly and drifts toward whoever is talking.',desc:'The mouth rests as a flat oval. The circle breathes very slightly, and the mouth drifts a few pixels toward the active speaker, with a small nod every few seconds as acknowledgement.',col:[63,107,94]},
 {label:'Thinking',short:'Mouth shrinks and slides side to side. Circle dims slightly.',desc:'The mouth contracts to a short oval, lifts a little and slides slowly side to side. The circle shrinks and darkens a touch.',col:[54,92,82]},
 {label:'Speaking',short:'Oval opens and closes with the voice.',desc:'The oval opens with voice amplitude: taller and slightly narrower on loud syllables, closing back to rest in pauses.',col:[63,107,94]},
 {label:'Empathizing',short:'Rounder, softer oval, slow nod, warmer green.',desc:'The mouth becomes a smaller, rounder oval. The circle grows slightly, nods slowly and shifts to a warmer green.',col:[78,118,92]},
 {label:'Calming',short:'Slow 4s in, 6s out breath. Lighter green.',desc:'The whole circle breathes on a slow 4-second inhale, 6-second exhale that people can follow. The mouth widens slightly on each inhale. The green lightens.',col:[92,134,118]}
];
function target(i,t,side){
  if(i===0){const nod=Math.max(0,Math.sin(t*1.6))**8*Math.max(0,Math.sin(t*0.4));return{w:28,o:6,cv:0,dx:side*7,dy:nod*4,s:1+0.012*Math.sin(t*1.1)};}
  if(i===1)return{w:12,o:6,cv:0,dx:12*Math.sin(t*0.8),dy:-5,s:0.97};
  if(i===2){const env=0.55+0.45*Math.sin(t*1.3);const syl=Math.abs(Math.sin(t*8.5))*Math.abs(Math.sin(t*3.1+1));const pause=Math.sin(t*0.7)>-0.6?1:0;const v=syl*env*pause;return{w:28-6*v,o:6+24*v,cv:0,dx:0,dy:0,s:1+0.01*v};}
  if(i===3)return{w:22,o:12,cv:0,dx:0,dy:2.5*Math.sin(t*1.3),s:1.025};
  const p=(t%10);const b=p<4?(1-Math.cos(Math.PI*p/4))/2:(1+Math.cos(Math.PI*(p-4)/6))/2;
  return{w:24+8*b,o:6,cv:0,dx:0,dy:0,s:0.98+0.07*b};
}
class Component extends DCLogic{
  state={sel:2,auto:true};
  hC=React.createRef();hM=React.createRef();
  cr=STATES.map(()=>({c:React.createRef(),m:React.createRef()}));
  componentDidMount(){
    const mk=()=>({w:28,o:6,cv:0,dx:0,dy:0,s:1,col:[63,107,94]});
    this.cur={h:mk(),c:STATES.map(mk)};this.last=performance.now();this.t0=this.last;this.lastSwitch=this.last;
    const tick=now=>{
      const dt=Math.min(0.05,(now-this.last)/1000);this.last=now;const t=(now-this.t0)/1000;
      if(this.state.auto&&now-this.lastSwitch>6000){this.lastSwitch=now;this.setState(s=>({sel:(s.sel+1)%5}));}
      const side=Math.sin(t*0.25)>0?1:-1;
      this.apply(this.cur.h,this.state.sel,t,side,dt,this.hC.current,this.hM.current);
      this.cr.forEach((r,i)=>this.apply(this.cur.c[i],i,t,side,dt,r.c.current,r.m.current));
      this.raf=requestAnimationFrame(tick);
    };
    this.raf=requestAnimationFrame(tick);
  }
  componentWillUnmount(){cancelAnimationFrame(this.raf);}
  apply(c,i,t,side,dt,circ,mouth){
    if(!circ||!mouth)return;
    const g=target(i,t,side),k=Math.min(1,dt*(i===2?14:4));
    for(const key of['w','o','cv','dx','dy','s'])c[key]+=(g[key]-c[key])*k;
    const kc=Math.min(1,dt*2);c.col=c.col.map((v,j)=>v+(STATES[i].col[j]-v)*kc);
    const r=80*c.s,x=100+c.dx,y=100+c.dy+30*c.s;
    circ.setAttribute('r',r.toFixed(2));circ.setAttribute('cy',(100+c.dy*0.3).toFixed(2));
    circ.setAttribute('fill',`rgb(${c.col.map(Math.round).join(',')})`);
    const rx=c.w,ry=c.o/2,f=n=>n.toFixed(2);
    mouth.setAttribute('d',`M${f(x-rx)} ${f(y)}A${f(rx)} ${f(ry)} 0 1 0 ${f(x+rx)} ${f(y)}A${f(rx)} ${f(ry)} 0 1 0 ${f(x-rx)} ${f(y)}Z`);
  }
  renderVals(){
    const sel=this.state.sel;
    return{
      hC:this.hC,hM:this.hM,auto:this.state.auto,cur:STATES[sel],
      toggleAuto:()=>{this.lastSwitch=performance.now();this.setState(s=>({auto:!s.auto}));},
      buttons:STATES.map((s,i)=>({label:s.label,bg:i===sel?'#3f6b5e':'#f6f5ef',fg:i===sel?'#f3f1e8':'#23302b',onClick:()=>this.setState({sel:i,auto:false})})),
      cards:STATES.map((s,i)=>({...s,rc:this.cr[i].c,rm:this.cr[i].m}))
    };
  }
}
</script>
</body>
</html>
