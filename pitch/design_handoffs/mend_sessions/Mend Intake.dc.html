<div style="min-height:100vh;box-sizing:border-box;padding:24px clamp(16px,3vw,44px);display:flex;flex-direction:column;gap:20px;max-width:1400px;margin:0 auto">

            <button onClick="{{ reset }}" style="font:inherit;font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;border:1px solid #17372E26;background:transparent;color:#17372E;cursor:pointer;white-space:nowrap">Start over</button>

<script type="text/x-dc" data-dc-script>
const MODES = {

      "A few things before we start: I’m here to represent your interests, not the company’s. Nothing in this conversation is recorded — there’s no transcript. The one exception is a small, fixed set of things — harassment or discrimination based on a protected characteristic, threats or violence, illegal activity, or an immediate safety risk — those get escalated to HR regardless of anything else. If that ever comes up, I’ll tell you directly; nothing gets reported silently. Otherwise, no manager at any company learns this conversation even happened.",

  practice: { title: 'Rehearse', sub: 'Practice the hard conversation before you have it', label: 'Rehearsal', ph: 'Say it the way you’d say it to them…',

  manager: { title: 'For managers', sub: 'Get advice on a hard conversation with someone you manage', label: 'Manager advice', ph: 'Describe what’s going on with your report…',
    welcome: ["This is for when you need to talk to someone who reports to you and aren’t sure how to say it. You don’t need to name them, and none of this goes to HR or your own manager.",

};
const bubbleBase = 'padding:12px 14px;border-radius:14px;font-size:14.5px;line-height:1.55;text-wrap:pretty;white-space:pre-wrap;max-width:88%';
const STATES = { listening: 'Listening', thinking: 'Thinking', talking: 'Talking', empathizing: 'Empathizing' };
const SEQ = [['listening', 6000], ['thinking', 2400], ['empathizing', 3400], ['talking', 5200]];
const LINES = { empathizing: 'That sounds exhausting. It makes sense you’d feel worn down by it.', talking: 'So — what’s going on? What happened, from your side?' };
const ctrl = on => 'width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;' + (on ? 'background:#17372E;color:#F6F1E7' : 'background:#FFFFFF;color:#17372E;box-shadow:inset 0 0 0 1px #17372E33');

  return e('div', { style: { position: 'relative', width: s, height: s, transform: shape.lean, transition: 'transform .7s cubic-bezier(.3,1.4,.5,1)' } },

      if (b) { const amp = 5 + L * 16, w1 = Math.sin(t / 240), w2 = Math.sin(t / 330 + 1), w3 = Math.sin(t / 290 + 2); b.style.borderRadius = lis ? (50 + w1 * amp * .5) + '% ' + (47 - L * 14 + w2 * amp * .5) + '% ' + (53 - L * 14 + w3 * amp * .5) + '% ' + (50 - w1 * amp * .5) + '% / ' + (58 + w2 * amp * .4) + '% ' + (58 - L * 8 + w3 * amp * .4) + '% ' + (42 - L * 8 - w2 * amp * .4) + '% ' + (42 - w3 * amp * .4) + '%' : ''; }

  stopAudio = () => { cancelAnimationFrame(this.raf); if (this.mic) this.mic.getTracks().forEach(t => t.stop()); if (this.actx) this.actx.close(); this.mic = this.actx = this.an = null; this.level = 0; };
  componentDidUpdate() {
    const el = this.scrollRef.current; if (el) el.scrollTop = el.scrollHeight;
    const v = this.videoRef.current; if (v && this.stream && v.srcObject !== this.stream) v.srcObject = this.stream;
  }
  componentWillUnmount() { this.unmounting = true; this.stopCall(); }
  step = i => { const [st, ms] = SEQ[i % SEQ.length]; if (this.state.auto) this.setState({ callState: st }); this.seqT = setTimeout(() => this.step(i + 1), ms); };
  startCall = () => { this.setState({ live: true, secs: 0, auto: true, callState: 'listening' }); this.tick = setInterval(() => this.setState(s => ({ secs: s.secs + 1 })), 1000); this.step(0); this.stopAudio(); this.startAudio(true); };
  stopCall = () => { clearInterval(this.tick); clearTimeout(this.seqT); this.stopCam(); this.stopAudio(); if (!this.unmounting) this.startAudio(false); };
  componentDidMount() { this.startAudio(false); }
  stopCam = () => { if (this.stream) this.stream.getTracks().forEach(t => t.stop()); this.stream = null; };
  toggleCam = async () => {
    if (this.state.cam) { this.stopCam(); return this.setState({ cam: false }); }
    try { this.stream = await navigator.mediaDevices.getUserMedia({ video: true }); this.setState({ cam: true }); } catch (e) { this.setState({ cam: false }); }
  };
  send = () => {
    const t = this.state.draft.trim(); if (!t) return;
    const m = this.state.mode;
    this.setState(s => ({ draft: '', thinking: true, stage: 'thinking', log: { ...s.log, [m]: [...s.log[m], { me: true, text: t }] } }));
    setTimeout(() => {
      this.setState(s => ({ thinking: false, stage: 'talking', log: { ...s.log, [m]: [...s.log[m], { me: false, text: 'Thank you for telling me. Take your time — what happened next?' }] } }));
      setTimeout(() => this.setState({ stage: 'listening' }), 2600);
    }, 1600);
  };
  renderVals() {
    const { mode, live, draft, callState, secs, muted, cam, captions, transcript, stage, auto } = this.state;
    const M = MODES[mode];
    const msgs = [...M.welcome.map(text => ({ me: false, text })), ...this.state.log[mode]];
    const disp = live ? callState : stage;
    const lastT = [...msgs].reverse().find(x => !x.me);
    const big = typeof window !== 'undefined' ? Math.max(140, Math.min(window.innerHeight - 400, window.innerWidth * .3, 420)) : 360;
    const picks = [['auto', 'Auto'], ...Object.entries(STATES)];
    return {
      modes: Object.entries(MODES).map(([k, v]) => {
        const on = k === mode;
        return { ...v, tag: v.tag || '', select: () => this.setState({ mode: k }),
          style: 'text-align:left;display:flex;flex-direction:column;justify-content:flex-start;gap:6px;min-width:0;padding:16px 18px;border-radius:14px;cursor:pointer;font:inherit;border:1px solid ' + (on ? '#17372E' : '#17372E1F') + ';background:' + (on ? '#17372E' : '#FFFFFF') + ';color:' + (on ? '#F6F1E7' : '#17372E') + ';min-height:44px' };
      }),
      modeLabel: M.label, placeholder: M.ph, draft,
      status: { listening: 'Type or tap the mic to start', thinking: 'Thimble is thinking…', talking: 'Thimble is replying' }[stage] || '',
      onDraft: e => this.setState({ draft: e.target.value }),
      onKey: e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.send(); } },
      send: this.send,
      toggleLive: () => live ? (this.stopCall(), this.setState({ live: false, cam: false })) : this.startCall(),
      liveLabel: live ? 'End live' : 'Go live',
      liveStyle: 'display:flex;align-items:center;gap:8px;height:52px;padding:0 22px;border-radius:999px;border:none;cursor:pointer;font:inherit;font-weight:700;font-size:15px;white-space:nowrap;background:' + (live ? '#F3829A' : '#17372E') + ';color:' + (live ? '#17372E' : '#F6F1E7'),
      liveDot: 'width:8px;height:8px;border-radius:50%;background:' + (live ? '#17372E' : '#F3829A'),
      isVoice: this.state.ui === 'voice', isText: this.state.ui === 'text', thinking: this.state.thinking,
      toVoice: () => this.setState({ ui: 'voice' }),
      toText: () => { if (live) { this.stopCall(); } this.setState({ ui: 'text', live: false }); },
      voiceTab: 'font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;border:none;cursor:pointer;background:' + (this.state.ui === 'voice' ? '#17372E' : 'transparent') + ';color:' + (this.state.ui === 'voice' ? '#F6F1E7' : '#17372E'), textTab: 'font:inherit;font-size:13px;font-weight:700;padding:8px 16px;border-radius:999px;border:none;cursor:pointer;background:' + (this.state.ui === 'text' ? '#17372E' : 'transparent') + ';color:' + (this.state.ui === 'text' ? '#F6F1E7' : '#17372E'),
      chatAvatar: avatar(stage, 44),
      chatStatus: { listening: 'Here to listen. Private, nothing is recorded.', thinking: 'Thinking…', talking: 'Replying…' }[stage] || '',
      reset: () => this.setState(s => ({ draft: '', log: { ...s.log, [mode]: [] } })),
      scrollRef: this.scrollRef, videoRef: this.videoRef,
      live, bigAvatar: avatar(disp, big, this.avRefs),
      youAvatar: avatar(this.state.youTalk ? 'talking' : 'listening', 64, null, '#E9B949'), tileRef: this.tileRef,
      timer: String(Math.floor(secs / 60)).padStart(2, '0') + ':' + String(secs % 60).padStart(2, '0'),
      stateLabel: STATES[disp] + (disp === 'listening' ? '…' : ''),
      caption: live ? (LINES[callState] || '') : (disp === 'thinking' ? '' : lastT.text), showCaption: captions && (live ? !!LINES[callState] : disp !== 'thinking'),
      statePicks: picks.map(([k, label]) => {
        const on = k === 'auto' ? auto : !auto && callState === k;
        return { label, pick: () => k === 'auto' ? this.setState({ auto: true }) : this.setState({ auto: false, callState: k }),
          style: 'font:inherit;font-size:12px;font-weight:600;padding:6px 10px;border-radius:999px;border:none;cursor:pointer;background:' + (on ? '#F6F1E7' : 'transparent') + ';color:' + (on ? '#17372E' : '#F6F1E7') };
      }),
      muted, camOn: cam, camOff: !cam, showTranscript: transcript,
      toggleMute: () => this.setState(s => ({ muted: !s.muted })), muteTitle: muted ? 'Unmute' : 'Mute', muteStyle: ctrl(!muted),
      toggleCam: this.toggleCam, camTitle: cam ? 'Turn camera off' : 'Turn camera on', camStyle: ctrl(cam),
      toggleCaptions: () => this.setState(s => ({ captions: !s.captions })), ccStyle: ctrl(captions),
      toggleTranscript: () => this.setState(s => ({ transcript: !s.transcript })), trStyle: ctrl(transcript),
      messages: msgs.map(x => ({ text: x.text, who: x.me ? 'You' : 'Thimble',
        wrap: 'display:flex;flex-direction:column;gap:4px;align-items:' + (x.me ? 'flex-end' : 'flex-start'),
        bubble: bubbleBase + (x.me ? ';background:#17372E;color:#F6F1E7;border-bottom-right-radius:4px' : ';background:#FFFFFF;color:#17372E;border-bottom-left-radius:4px'),
        chatBubble: 'padding:12px 16px;border-radius:16px;font-size:15.5px;line-height:1.6;text-wrap:pretty;white-space:pre-wrap;max-width:80%' + (x.me ? ';background:#17372E;color:#F6F1E7;border-bottom-right-radius:4px' : ';background:#F6F1E7;color:#17372E;border-bottom-left-radius:4px') }))
    };
  }
}
</script>
</body>
</html>
