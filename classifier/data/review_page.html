<style>
:root{
  --ink:#1B2B2A; --ink-soft:#3C4C49; --paper:#F2F3EE; --card:#FFFFFF;
  --accent:#3D6B62; --accent-soft:#E6EDE9;
  --danger:#8C3B2E; --danger-soft:#F3E1DC;
  --warn:#8A6D2F; --warn-soft:#F1E8D2;
  --border:#DADFD9;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#EDEEE7; --ink-soft:#C7CBC1; --paper:#151E1C; --card:#1C2724;
    --accent:#7CB0A4; --accent-soft:#22322C;
    --danger:#E08A73; --danger-soft:#3A241E;
    --warn:#D8BC72; --warn-soft:#332C1B;
    --border:#33403B;
  }
}
:root[data-theme="dark"]{
  --ink:#EDEEE7; --ink-soft:#C7CBC1; --paper:#151E1C; --card:#1C2724;
  --accent:#7CB0A4; --accent-soft:#22322C;
  --danger:#E08A73; --danger-soft:#3A241E;
  --warn:#D8BC72; --warn-soft:#332C1B;
  --border:#33403B;
}
*{box-sizing:border-box}
body{background:var(--paper); color:var(--ink); font-family:'Public Sans',system-ui,sans-serif; padding-inline:16px; padding-block:32px;}
.wrap{max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:24px;}
.top{display:flex; flex-direction:column; gap:8px;}
.eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.04em; color:var(--ink-soft); text-transform:uppercase; display:flex; justify-content:space-between;}
.bar{height:4px; border-radius:2px; background:var(--accent-soft); overflow:hidden;}
.bar-fill{height:100%; background:var(--accent); border-radius:2px; transition:width .25s ease;}
.card{background:var(--card); border:1px solid var(--border); border-radius:12px; padding:40px 32px; min-height:180px; display:flex; align-items:center; justify-content:center; text-align:center;}
.quote{font-family:'Fraunces',Georgia,serif; font-weight:500; font-size:22px; line-height:1.5; color:var(--ink);}
.buttons{display:flex; gap:10px; flex-wrap:wrap;}
button.judge{flex:1 1 110px; padding:14px 10px; border-radius:10px; font-family:'Public Sans',sans-serif; font-weight:600; font-size:14px; cursor:pointer; border:1.5px solid var(--border); background:var(--card); color:var(--ink); transition:border-color .15s, background .15s;}
button.judge .hint{display:block; font-family:'IBM Plex Mono',monospace; font-weight:400; font-size:10px; color:var(--ink-soft); margin-top:4px; letter-spacing:.03em;}
button.judge.ok:hover{border-color:var(--accent); background:var(--accent-soft);}
button.judge.bad:hover{border-color:var(--danger); background:var(--danger-soft);}
button.judge.unsure:hover{border-color:var(--warn); background:var(--warn-soft);}
.meta-row{display:flex; align-items:center; justify-content:space-between;}
.back-link{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); background:none; border:none; cursor:pointer; padding:4px 0;}
.back-link:hover{color:var(--accent);}
.back-link:disabled{opacity:.35; cursor:default;}
.tally{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft);}
.done .quote{font-size:20px;}
.stat-row{display:flex; gap:16px; justify-content:center; margin-top:8px;}
.stat{text-align:center;}
.stat .n{font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:500; color:var(--accent);}
.stat .n.bad{color:var(--danger);}
.stat .l{font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em;}
.edited-flag{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--accent); margin-top:10px;}
</style>

let db = null;
let order = ITEMS.map(it => it.id);
let judgments = {}; // id -> {judgment, autoFlag}
let cursor = 0;
let history = [];

const els = {
  counter: document.getElementById('counter'),
  barFill: document.getElementById('barFill'),
  card: document.getElementById('card'),
  quoteText: document.getElementById('quoteText'),
  buttons: document.getElementById('buttons'),
  btnOk: document.getElementById('btnOk'),
  btnUnsure: document.getElementById('btnUnsure'),
  btnBad: document.getElementById('btnBad'),
  btnBack: document.getElementById('btnBack'),
  tally: document.getElementById('tally'),
};

function itemById(id){ return ITEMS.find(it => it.id === id); }

function render(){
  const judgedCount = Object.keys(judgments).length;
  els.counter.textContent = judgedCount + ' / ' + ITEMS.length;
  els.barFill.style.width = (100 * judgedCount / ITEMS.length).toFixed(1) + '%';

  const ok = Object.values(judgments).filter(j => j.judgment === 'appropriate').length;
  const unsure = Object.values(judgments).filter(j => j.judgment === 'unsure').length;
  const bad = Object.values(judgments).filter(j => j.judgment === 'inappropriate').length;
  els.tally.textContent = ok + ' appropriate · ' + unsure + ' unsure · ' + bad + ' inappropriate';
  els.btnBack.disabled = history.length === 0;

  if (judgedCount >= ITEMS.length){
    renderDone(ok, unsure, bad);
    return;
  }

  const nextId = order.find(id => !judgments[id]);
  const item = itemById(nextId);
  els.card.classList.remove('done');
  els.quoteText.textContent = '“' + item.text + '”';
  els.buttons.style.display = 'flex';
}

function renderDone(ok, unsure, bad){
  els.card.classList.add('done');
  let mismatches = 0;
  let decided = 0;
  for (const id in judgments){
    const j = judgments[id].judgment;
    if (j === 'unsure') continue;
    decided++;
    const it = itemById(id);
    const said = j === 'inappropriate';
    if (said !== it.autoFlag) mismatches++;
  }
  els.quoteText.innerHTML =
    'Review complete.<br><span style="font-family:\'IBM Plex Mono\',monospace;font-size:13px;color:var(--ink-soft);display:block;margin-top:14px;">' +
    'Disagreed with the draft labels on ' + mismatches + ' of ' + decided + ' decided (' + unsure + ' marked not sure).</span>';
  els.buttons.style.display = 'none';
}

function judge(value){
  const nextId = order.find(id => !judgments[id]);
  if (!nextId) return;
  const item = itemById(nextId);
  judgments[nextId] = { judgment: value, autoFlag: item.autoFlag };
  history.push(nextId);
  render();
  persist(item, value);
}

function goBack(){
  const lastId = history.pop();
  if (!lastId) return;
  delete judgments[lastId];
  render();
}

async function persist(item, value){
  if (!db) return;
  try {
    await db.doc('reviews/' + item.id).set({
      text: item.text,
      source: item.source,
      autoFlag: item.autoFlag,
      cats: item.cats,
      inProgress: item.inProgress,
      judgment: value,
      judgedAt: new Date().toISOString(),
    });
  } catch (e) {
    console.error('review write failed', e);
  }
}

async function loadExisting(){
  if (!db) { render(); return; }
  try {
    const snap = await db.collection('reviews').get();
    snap.docs.forEach(doc => {
      const data = doc.data();
      if (data && data.judgment){
        judgments[doc.id] = { judgment: data.judgment, autoFlag: data.autoFlag };
        history.push(doc.id);
      }
    });
  } catch (e) {
    console.error('review load failed', e);
  }
  render();
}

els.btnOk.addEventListener('click', () => judge('appropriate'));
els.btnUnsure.addEventListener('click', () => judge('unsure'));
els.btnBad.addEventListener('click', () => judge('inappropriate'));
els.btnBack.addEventListener('click', goBack);

document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase();
  if (e.key === 'ArrowLeft' || k === 'a') judge('appropriate');
  else if (k === 's' || e.key === '?') judge('unsure');
  else if (e.key === 'ArrowRight' || k === 'i') judge('inappropriate');
  else if (e.key === 'Backspace') goBack();
});

(async () => {
  try {
    db = await claude.use('db');
  } catch (e) {
    db = null;
  }
  loadExisting();
})();
</script>
