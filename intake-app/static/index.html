<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mend intake (local prototype)</title>
<style>
  :root{
    --ink:#1B2B2A; --ink-soft:#3C4C49; --paper:#F2F3EE; --card:#FFFFFF;
    --accent:#3D6B62; --accent-soft:#E6EDE9; --border:#DADFD9;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Public Sans',sans-serif;}
  .wrap{max-width:1200px; margin:0 auto; padding:20px 24px; display:flex; flex-direction:column; height:100vh;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;}
  .thread{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:16px;}
  .msg{max-width:80%; padding:12px 14px; border-radius:12px; line-height:1.5; font-size:15px; white-space:pre-wrap;}
  .msg.facilitator{background:var(--card); border:1px solid var(--border); align-self:flex-start;}
  .msg.employee{background:var(--accent); color:#fff; align-self:flex-end;}
  .msg.transcript{font-style:italic; opacity:.7;}
  .composer{display:flex; gap:8px; align-items:flex-end; border-top:1px solid var(--border); padding-top:12px;}
  textarea{flex:1; resize:none; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; font:inherit; font-size:15px; background:var(--card); color:var(--ink);}
  button{border:1.5px solid var(--border); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.recording{background:#8C3B2E; color:#fff; border-color:#8C3B2E;}
  button:disabled{opacity:.5; cursor:default;}
  .status{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:6px;}
  .banner{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; margin-top:10px; font-size:13.5px;}
  .banner a{text-decoration:none;}
  .banner button{background:var(--accent); color:#fff; border-color:var(--accent); padding:7px 12px; font-size:13px;}
  .video-toggle{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .video-toggle button{font-size:12.5px; padding:6px 10px;}
  .video-area{flex:1; display:flex; flex-direction:column; gap:8px;}
  .video-area iframe{flex:1; width:100%; border:1px solid var(--border); border-radius:12px; background:#000;}
  .avatar-row{display:flex; justify-content:center; padding:8px 0 4px;}
  #avatarCanvas{display:block;}
  .caption{min-height:44px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:16px; font-weight:600; line-height:1.4; padding:0 12px 10px; color:var(--ink); max-width:480px;}
  .live-row{display:flex; align-items:center; gap:10px; margin-top:8px;}
  .live-row button{font-size:13px; padding:7px 12px; flex-shrink:0;}
  .live-row button.recording{background:#8C3B2E; color:#fff; border-color:#8C3B2E;}
  .live-hint{font-size:11.5px; color:var(--ink-soft); line-height:1.4;}

  /* Zoom-call style layout: the avatar + captions + controls are the main
     event, full attention like a video tile; the transcript is reference
     material, docked to the side rather than the main flow. */
  .call-layout{flex:1; display:flex; min-height:0; border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--card);}
  .call-main{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:24px; min-width:0; min-height:0; background:var(--paper);}
  .call-controls{width:100%; max-width:480px; display:flex; flex-direction:column; gap:8px;}
  .transcript-panel{width:340px; flex-shrink:0; min-height:0; border-left:1px solid var(--border); display:flex; flex-direction:column; background:var(--card);}
  .transcript-header{padding:14px 16px; font-family:'IBM Plex Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border-bottom:1px solid var(--border); flex-shrink:0; display:flex; justify-content:space-between; align-items:center;}
  .transcript-header button{font-size:11px; padding:5px 9px; text-transform:none; letter-spacing:normal; font-family:-apple-system,BlinkMacSystemFont,'Public Sans',sans-serif;}
  .transcript-panel .thread{flex:1; min-height:0; overflow-y:auto; padding:16px; margin:0;}
  @media (max-width: 760px){
    .call-layout{flex-direction:column;}
    .transcript-panel{width:100%; border-left:none; border-top:1px solid var(--border); max-height:220px;}
  }
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Mend &middot; intake (local prototype, text + voice memo)</div>
  <div class="video-toggle" id="videoToggle" hidden>
    <button id="videoStartBtn">Start video call</button>
  </div>

  <div id="textMode" class="video-area" style="flex-direction:column;">
    <div class="call-layout">
      <div class="call-main">
        <div class="avatar-row"><canvas id="avatarCanvas" width="200" height="200"></canvas></div>
        <div class="caption" id="caption"></div>
        <div class="call-controls">
          <div class="composer">
            <textarea id="input" rows="2" placeholder="Type a message..."></textarea>
            <button id="recordBtn" title="Record a voice memo">&#127908;</button>
            <button id="sendBtn" class="primary">Send</button>
          </div>
          <div class="live-row">
            <button id="liveBtn">Go live</button>
            <span class="live-hint">Hands-free: it listens, replies, then listens again automatically until you end it.</span>
          </div>
          <div class="status" id="status"></div>
        </div>
      </div>
      <div class="transcript-panel">
        <div class="transcript-header">
          <span>Transcript</span>
          <button id="resetBtn" title="Start a new conversation">Reset</button>
        </div>
        <div class="thread" id="thread"></div>
      </div>
    </div>
  </div>

  <div id="videoMode" class="video-area" hidden>
    <iframe id="videoFrame" allow="camera; microphone; autoplay; display-capture" title="Mend facilitator video call"></iframe>
    <button id="videoEndBtn">End video call</button>
  </div>

  <div class="banner" id="banner" hidden>
    <span>Facilitator says you're ready for a joint session.</span>
    <a href="http://localhost:8421/" target="_blank" rel="noopener"><button>Continue &rarr;</button></a>
  </div>
</div>

<script>
const thread = document.getElementById('thread');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const recordBtn = document.getElementById('recordBtn');
const statusEl = document.getElementById('status');

const audioEl = new Audio();

// Abstract avatar: a plain shape with a mouth, in place of a realistic
// video face. Four states: idle (resting), listening (reacts to the
// employee's own mic while recording a voice memo), thinking (waiting on
// the facilitator), talking (reacts to the facilitator's own TTS audio).
let avatarState = 'idle';
let audioCtx = null, analyser = null, avatarData = null;
let micAudioCtx = null, micAnalyser = null, micData = null;
const avatarCanvas = document.getElementById('avatarCanvas');
const avatarCtx = avatarCanvas.getContext('2d');

function ensureAudioGraph() {
  if (audioCtx) return;
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaElementSource(audioEl);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    avatarData = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
  } catch (e) {} // Web Audio unavailable; avatar just stays idle, audio still plays normally
}

function startMicAnalysis(stream) {
  try {
    micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = micAudioCtx.createMediaStreamSource(stream);
    micAnalyser = micAudioCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    source.connect(micAnalyser); // not connected to destination -- we don't want to echo the mic back
  } catch (e) {}
}

function stopMicAnalysis() {
  if (micAudioCtx) micAudioCtx.close().catch(() => {});
  micAudioCtx = null;
  micAnalyser = null;
  micData = null;
}

function rmsLevel(analyserNode, dataArr) {
  analyserNode.getByteTimeDomainData(dataArr);
  let sumSq = 0;
  for (let i = 0; i < dataArr.length; i++) {
    const v = (dataArr[i] - 128) / 128;
    sumSq += v * v;
  }
  return Math.min(1, Math.sqrt(sumSq / dataArr.length) * 4);
}

function drawBase() {
  const w = avatarCanvas.width, h = avatarCanvas.height;
  const style = getComputedStyle(document.body);
  avatarCtx.clearRect(0, 0, w, h);
  avatarCtx.fillStyle = style.getPropertyValue('--accent').trim() || '#3D6B62';
  avatarCtx.beginPath();
  avatarCtx.arc(w / 2, h / 2, w / 2 - 10, 0, Math.PI * 2);
  avatarCtx.fill();
  avatarCtx.fillStyle = style.getPropertyValue('--paper').trim() || '#F2F3EE';
  return {w, h};
}

function drawMouth(level) {
  const {w, h} = drawBase();
  const mouthW = 70, mouthH = 6 + level * 64;
  avatarCtx.beginPath();
  avatarCtx.ellipse(w / 2, h / 2 + 17, mouthW / 2, mouthH / 2, 0, 0, Math.PI * 2);
  avatarCtx.fill();
}

// Distinct from drawMouth() on purpose: listening (reacting to your own
// voice) must not look like talking (an open mouth), or it reads as the
// avatar mimicking or interrupting you. The whole circle pulses in size
// with your volume instead, mouth staying closed.
function drawListening(level) {
  const w = avatarCanvas.width, h = avatarCanvas.height;
  const style = getComputedStyle(document.body);
  avatarCtx.clearRect(0, 0, w, h);
  const r = 67 + level * 30; // stays well inside the 200x200 canvas at max
  avatarCtx.fillStyle = style.getPropertyValue('--accent').trim() || '#3D6B62';
  avatarCtx.beginPath();
  avatarCtx.arc(w / 2, h / 2, r, 0, Math.PI * 2);
  avatarCtx.fill();
  // No mouth at all here, on purpose: listening animates by pulsing the
  // whole shape with your mic volume, with nothing that reads as a face
  // about to speak.
}

function drawThinking(now) {
  const {w, h} = drawBase();
  const baseY = h / 2 + 17, spacing = 23, baseR = 7;
  for (let i = -1; i <= 1; i++) {
    const phase = now / 300 + i * 0.6;
    const bump = (Math.sin(phase) + 1) / 2; // 0..1
    avatarCtx.beginPath();
    avatarCtx.arc(w / 2 + i * spacing, baseY, baseR + bump * 4, 0, Math.PI * 2);
    avatarCtx.fill();
  }
}

// Captions: no real per-word timing from either TTS backend, so the reply
// is split into short chunks and each chunk's start time is estimated
// proportionally to its share of the total character count -- close enough
// to read like real subtitles without needing forced alignment.
const captionEl = document.getElementById('caption');
let captionChunks = [];
let captionStarts = [];

function splitCaptionChunks(text) {
  const sentences = (text || '').replace(/\s+/g, ' ').trim().split(/(?<=[.!?])\s+/).filter(Boolean);
  const chunks = [];
  let cur = '';
  for (const s of sentences) {
    if (cur && (cur + ' ' + s).length > 90) { chunks.push(cur); cur = s; }
    else { cur = cur ? cur + ' ' + s : s; }
  }
  if (cur) chunks.push(cur);
  return chunks;
}

function computeCaptionStarts() {
  if (!captionChunks.length || !isFinite(audioEl.duration) || audioEl.duration <= 0) return;
  const lens = captionChunks.map(c => c.length);
  const total = lens.reduce((a, b) => a + b, 0) || 1;
  let acc = 0;
  captionStarts = lens.map((len) => {
    const start = (acc / total) * audioEl.duration;
    acc += len;
    return start;
  });
}

function updateCaption() {
  if (avatarState !== 'talking' || !captionChunks.length) {
    captionEl.textContent = '';
    return;
  }
  if (captionStarts.length !== captionChunks.length) computeCaptionStarts();
  let idx = 0;
  for (let i = 0; i < captionStarts.length; i++) {
    if (audioEl.currentTime >= captionStarts[i]) idx = i;
  }
  captionEl.textContent = captionChunks[idx] || '';
}

function animateAvatar(now) {
  requestAnimationFrame(animateAvatar);
  const t = now || performance.now();
  if (avatarState === 'talking' && analyser && !audioEl.paused) {
    drawMouth(rmsLevel(analyser, avatarData));
  } else if (avatarState === 'listening' && micAnalyser) {
    const level = rmsLevel(micAnalyser, micData);
    drawListening(level);
    if (liveMode) checkVad(level, t);
  } else if (avatarState === 'thinking') {
    drawThinking(t);
  } else {
    drawMouth(0);
  }
  updateCaption();
}
animateAvatar();

audioEl.addEventListener('loadedmetadata', computeCaptionStarts);
audioEl.addEventListener('play', () => { avatarState = 'talking'; });
audioEl.addEventListener('pause', () => { if (avatarState === 'talking') avatarState = 'idle'; });
audioEl.addEventListener('ended', () => {
  if (avatarState === 'talking') avatarState = 'idle';
  if (liveMode) startRecordingTurnSafe();
});

function playReplyAudio(url, text) {
  captionChunks = splitCaptionChunks(text);
  captionStarts = [];
  if (!url) { avatarState = 'idle'; return; }
  ensureAudioGraph();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  audioEl.src = url;
  audioEl.play().catch(() => {}); // autoplay can be blocked before first user gesture; harmless if so
}

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

const banner = document.getElementById('banner');

function handleSignal(signal) {
  if (!signal) return;
  try {
    const s = JSON.parse(signal);
    banner.hidden = !s.ready_for_joint_session;
  } catch (e) {}
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  statusEl.textContent = busy ? 'facilitator is responding...' : '';
}

async function sendText() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'employee');
  setBusy(true);
  avatarState = 'thinking';
  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    if (data.reply) addMessage(data.reply, 'facilitator');
    playReplyAudio(data.audio_url, data.reply);
    handleSignal(data.signal);
  } catch (e) {
    statusEl.textContent = 'error: ' + e.message;
    avatarState = 'idle';
  } finally {
    setBusy(false);
  }
}

sendBtn.addEventListener('click', sendText);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

let mediaRecorder = null;
let chunks = [];
let liveMode = false;

// Voice-activity detection for live mode: neither TTS backend gives us
// real-time streaming STT, so a live "conversation" here means auto-stopping
// the recording once the mic goes quiet, rather than an always-on stream.
// VAD_THRESHOLD is a floor, on the same 0..1 scale rmsLevel() already
// produces, not the actual threshold used: every turn starts with a brief
// calibration window that measures your real ambient noise (fan, room echo,
// mic self-noise) and sets the real threshold above THAT, since a fixed
// absolute number can't tell your background hum from your voice. Without
// this, continuous ambient noise above the fixed threshold looked like
// nonstop speech, and once it happened to dip briefly, got sent as a memo,
// then the whole thing repeated on the next turn -- "keeps making voice
// memos when I'm not talking."
const VAD_THRESHOLD = 0.06;
const VAD_SILENCE_MS = 1800;
const VAD_MIN_SPEECH_MS = 500;
const VAD_CALIBRATION_MS = 400;
let vadSpeaking = false;
let vadSpeechStarted = null;
let vadSilenceSince = null;
let vadCalibrating = false;
let vadCalibrateEndsAt = 0;
let vadNoiseFloor = 0;
let vadThreshold = VAD_THRESHOLD;

function startVadCalibration(now) {
  vadCalibrating = true;
  vadCalibrateEndsAt = now + VAD_CALIBRATION_MS;
  vadNoiseFloor = 0;
  vadThreshold = VAD_THRESHOLD;
}

function checkVad(level, now) {
  if (!mediaRecorder || mediaRecorder.state !== 'recording') return;
  if (vadCalibrating) {
    vadNoiseFloor = Math.max(vadNoiseFloor, level);
    if (now < vadCalibrateEndsAt) return;
    vadCalibrating = false;
    vadThreshold = Math.max(VAD_THRESHOLD, vadNoiseFloor * 1.6 + 0.015);
    return; // real detection resumes next frame against the calibrated threshold
  }
  if (level > vadThreshold) {
    if (!vadSpeaking) { vadSpeaking = true; vadSpeechStarted = now; }
    vadSilenceSince = null;
    return;
  }
  if (!vadSpeaking) return;
  if (vadSilenceSince === null) vadSilenceSince = now;
  if (now - vadSilenceSince < VAD_SILENCE_MS) return; // still inside the grace window, keep waiting
  // Silence window elapsed. Was there actually enough speech before it started,
  // or was this a click/breath/mic pop? Measuring "now - vadSpeechStarted" here
  // was the bug: that's always >= VAD_SILENCE_MS by this point, so any blip at
  // all used to pass. The real question is how long the sound itself lasted,
  // from its own start to when it went quiet.
  const speechDuration = vadSilenceSince - vadSpeechStarted;
  if (speechDuration > VAD_MIN_SPEECH_MS) {
    mediaRecorder.stop();
  } else {
    vadSpeaking = false;
    vadSpeechStarted = null;
    vadSilenceSince = null;
  }
}

async function startRecordingTurnSafe() {
  // For live mode's own auto-continue points: if the mic fails partway
  // through a conversation (permission revoked, device unplugged, another
  // app grabs it), fall back to ending live mode cleanly instead of an
  // unhandled rejection that leaves the button stuck saying "End live
  // conversation" while nothing is actually listening.
  try {
    await startRecordingTurn();
  } catch (e) {
    liveMode = false;
    liveBtn.textContent = 'Go live';
    statusEl.textContent = 'lost microphone access, live mode ended: ' + e.message;
  }
}

async function startRecordingTurn() {
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  mediaRecorder = new MediaRecorder(stream);
  chunks = [];
  vadSpeaking = false;
  vadSpeechStarted = null;
  vadSilenceSince = null;
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    stopMicAnalysis();
    recordBtn.classList.remove('recording');
    liveBtn.classList.remove('recording');
    const blob = new Blob(chunks, {type: 'audio/webm'});
    addMessage('[voice memo]', 'employee transcript');
    setBusy(true);
    avatarState = 'thinking';
    statusEl.textContent = 'transcribing...';
    try {
      const form = new FormData();
      form.append('file', blob, 'memo.webm');
      const res = await fetch('/api/voice', {method: 'POST', body: form});
      const data = await res.json();
      if (data.error) {
        statusEl.textContent = data.error;
        avatarState = 'idle';
        if (liveMode) startRecordingTurnSafe(); // e.g. a VAD-triggered clip too short/quiet to transcribe -- keep listening
      } else {
        if (data.transcript) addMessage('"' + data.transcript + '"', 'employee transcript');
        if (data.reply) addMessage(data.reply, 'facilitator');
        playReplyAudio(data.audio_url, data.reply);
        handleSignal(data.signal);
      }
    } catch (e) {
      statusEl.textContent = 'error: ' + e.message;
      avatarState = 'idle';
      if (liveMode) startRecordingTurnSafe();
    } finally {
      setBusy(false);
    }
  };
  mediaRecorder.start();
  avatarState = 'listening';
  startMicAnalysis(stream);
  startVadCalibration(performance.now());
  recordBtn.classList.add('recording');
  if (liveMode) liveBtn.classList.add('recording');
}

async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  try {
    await startRecordingTurn();
  } catch (e) {
    statusEl.textContent = 'couldn\'t access the microphone: ' + e.message;
  }
}

recordBtn.addEventListener('click', toggleRecording);

const liveBtn = document.getElementById('liveBtn');

async function toggleLiveMode() {
  if (liveMode) {
    liveMode = false;
    liveBtn.textContent = 'Go live';
    if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
    return;
  }
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    liveMode = true;
    liveBtn.textContent = 'End live conversation';
    return;
  }
  try {
    await startRecordingTurn();
    liveMode = true;
    liveBtn.textContent = 'End live conversation';
  } catch (e) {
    statusEl.textContent = 'couldn\'t access the microphone: ' + e.message;
    // liveMode stays off and the button stays "Go live" -- nothing to clean up,
    // startRecordingTurn never got far enough to create a recorder or start listening
  }
}

liveBtn.addEventListener('click', toggleLiveMode);

const videoToggle = document.getElementById('videoToggle');
const videoStartBtn = document.getElementById('videoStartBtn');
const videoEndBtn = document.getElementById('videoEndBtn');
const textMode = document.getElementById('textMode');
const videoMode = document.getElementById('videoMode');
const videoFrame = document.getElementById('videoFrame');
let videoSignalTimer = null;

async function startVideoCall() {
  videoStartBtn.disabled = true;
  try {
    const res = await fetch('/api/video/start', {method: 'POST'});
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = data.error;
      return;
    }
    videoFrame.src = data.conversation_url;
    textMode.hidden = true;
    videoMode.hidden = false;
    videoSignalTimer = setInterval(async () => {
      const r = await fetch('/api/video/signal');
      const d = await r.json();
      handleSignal(d.signal);
    }, 3000);
  } finally {
    videoStartBtn.disabled = false;
  }
}

async function endVideoCall() {
  clearInterval(videoSignalTimer);
  await fetch('/api/video/end', {method: 'POST'});
  videoFrame.src = 'about:blank';
  videoMode.hidden = true;
  textMode.hidden = false;
}

videoStartBtn.addEventListener('click', startVideoCall);
videoEndBtn.addEventListener('click', endVideoCall);

(async function checkVideoEnabled() {
  try {
    const res = await fetch('/api/video/enabled');
    const data = await res.json();
    videoToggle.hidden = !data.enabled;
  } catch (e) {}
})();

async function start() {
  setBusy(true);
  avatarState = 'thinking';
  try {
    const res = await fetch('/api/start', {method: 'POST'});
    const data = await res.json();
    if (data.reply) addMessage(data.reply, 'facilitator');
    playReplyAudio(data.audio_url, data.reply);
    handleSignal(data.signal);
  } finally {
    setBusy(false);
  }
}

const resetBtn = document.getElementById('resetBtn');
resetBtn.addEventListener('click', async () => {
  if (liveMode) await toggleLiveMode(); // stop the live loop before wiping state under it
  if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
  audioEl.pause();
  audioEl.src = '';
  captionEl.textContent = '';
  avatarState = 'idle';
  resetBtn.disabled = true;
  try {
    await fetch('/api/reset', {method: 'POST'});
    thread.innerHTML = '';
    banner.hidden = true;
    await start();
  } finally {
    resetBtn.disabled = false;
  }
});

start();
</script>
</body>
</html>
