<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mend intake (local prototype)</title>
<style>
  :root{
    --ink:#1B2B2A; --ink-soft:#3C4C49; --paper:#F2F3EE; --card:#FFFFFF;
    --accent:#3D6B62; --accent-soft:#E6EDE9; --border:#DADFD9;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'Public Sans',sans-serif;}
  .wrap{max-width:640px; margin:0 auto; padding:24px 16px; display:flex; flex-direction:column; height:100vh;}
  .eyebrow{font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; margin-bottom:12px;}
  .thread{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding-bottom:16px;}
  .msg{max-width:80%; padding:12px 14px; border-radius:12px; line-height:1.5; font-size:15px; white-space:pre-wrap;}
  .msg.facilitator{background:var(--card); border:1px solid var(--border); align-self:flex-start;}
  .msg.employee{background:var(--accent); color:#fff; align-self:flex-end;}
  .msg.transcript{font-style:italic; opacity:.7;}
  .composer{display:flex; gap:8px; align-items:flex-end; border-top:1px solid var(--border); padding-top:12px;}
  textarea{flex:1; resize:none; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; font:inherit; font-size:15px; background:var(--card); color:var(--ink);}
  button{border:1.5px solid var(--border); background:var(--card); color:var(--ink); border-radius:10px; padding:10px 14px; font:inherit; font-weight:600; cursor:pointer;}
  button.primary{background:var(--accent); color:#fff; border-color:var(--accent);}
  button.recording{background:#8C3B2E; color:#fff; border-color:#8C3B2E;}
  button:disabled{opacity:.5; cursor:default;}
  .status{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:6px;}
  .banner{display:flex; justify-content:space-between; align-items:center; gap:10px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; margin-top:10px; font-size:13.5px;}
  .banner a{text-decoration:none;}
  .banner button{background:var(--accent); color:#fff; border-color:var(--accent); padding:7px 12px; font-size:13px;}
  .video-toggle{display:flex; justify-content:flex-end; margin-bottom:8px;}
  .video-toggle button{font-size:12.5px; padding:6px 10px;}
  .video-area{flex:1; display:flex; flex-direction:column; gap:8px;}
  .video-area iframe{flex:1; width:100%; border:1px solid var(--border); border-radius:12px; background:#000;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Mend &middot; intake (local prototype, text + voice memo)</div>
  <div class="video-toggle" id="videoToggle" hidden>
    <button id="videoStartBtn">Start video call</button>
  </div>

  <div id="textMode" class="video-area" style="flex-direction:column;">
    <div class="thread" id="thread"></div>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="Type a message..."></textarea>
      <button id="recordBtn" title="Record a voice memo">&#127908;</button>
      <button id="sendBtn" class="primary">Send</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div id="videoMode" class="video-area" hidden>
    <iframe id="videoFrame" allow="camera; microphone; autoplay; display-capture" title="Mend facilitator video call"></iframe>
    <button id="videoEndBtn">End video call</button>
  </div>

  <div class="banner" id="banner" hidden>
    <span>Facilitator says you're ready for a joint session.</span>
    <a href="http://localhost:8421/" target="_blank" rel="noopener"><button>Continue &rarr;</button></a>
  </div>
</div>

<script>
const thread = document.getElementById('thread');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const recordBtn = document.getElementById('recordBtn');
const statusEl = document.getElementById('status');

const audioEl = new Audio();
function playReplyAudio(url) {
  if (!url) return;
  audioEl.src = url;
  audioEl.play().catch(() => {}); // autoplay can be blocked before first user gesture; harmless if so
}

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

const banner = document.getElementById('banner');

function handleSignal(signal) {
  if (!signal) return;
  try {
    const s = JSON.parse(signal);
    banner.hidden = !s.ready_for_joint_session;
  } catch (e) {}
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  statusEl.textContent = busy ? 'facilitator is responding...' : '';
}

async function sendText() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'employee');
  setBusy(true);
  try {
    const res = await fetch('/api/message', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    if (data.reply) addMessage(data.reply, 'facilitator');
    playReplyAudio(data.audio_url);
    handleSignal(data.signal);
  } catch (e) {
    statusEl.textContent = 'error: ' + e.message;
  } finally {
    setBusy(false);
  }
}

sendBtn.addEventListener('click', sendText);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendText();
  }
});

let mediaRecorder = null;
let chunks = [];

async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  mediaRecorder = new MediaRecorder(stream);
  chunks = [];
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recordBtn.classList.remove('recording');
    const blob = new Blob(chunks, {type: 'audio/webm'});
    addMessage('[voice memo]', 'employee transcript');
    setBusy(true);
    statusEl.textContent = 'transcribing...';
    try {
      const form = new FormData();
      form.append('file', blob, 'memo.webm');
      const res = await fetch('/api/voice', {method: 'POST', body: form});
      const data = await res.json();
      if (data.error) {
        statusEl.textContent = data.error;
      } else {
        if (data.transcript) addMessage('"' + data.transcript + '"', 'employee transcript');
        if (data.reply) addMessage(data.reply, 'facilitator');
        playReplyAudio(data.audio_url);
    handleSignal(data.signal);
      }
    } catch (e) {
      statusEl.textContent = 'error: ' + e.message;
    } finally {
      setBusy(false);
    }
  };
  mediaRecorder.start();
  recordBtn.classList.add('recording');
}

recordBtn.addEventListener('click', toggleRecording);

const videoToggle = document.getElementById('videoToggle');
const videoStartBtn = document.getElementById('videoStartBtn');
const videoEndBtn = document.getElementById('videoEndBtn');
const textMode = document.getElementById('textMode');
const videoMode = document.getElementById('videoMode');
const videoFrame = document.getElementById('videoFrame');
let videoSignalTimer = null;

async function startVideoCall() {
  videoStartBtn.disabled = true;
  try {
    const res = await fetch('/api/video/start', {method: 'POST'});
    const data = await res.json();
    if (data.error) {
      statusEl.textContent = data.error;
      return;
    }
    videoFrame.src = data.conversation_url;
    textMode.hidden = true;
    videoMode.hidden = false;
    videoSignalTimer = setInterval(async () => {
      const r = await fetch('/api/video/signal');
      const d = await r.json();
      handleSignal(d.signal);
    }, 3000);
  } finally {
    videoStartBtn.disabled = false;
  }
}

async function endVideoCall() {
  clearInterval(videoSignalTimer);
  await fetch('/api/video/end', {method: 'POST'});
  videoFrame.src = 'about:blank';
  videoMode.hidden = true;
  textMode.hidden = false;
}

videoStartBtn.addEventListener('click', startVideoCall);
videoEndBtn.addEventListener('click', endVideoCall);

(async function checkVideoEnabled() {
  try {
    const res = await fetch('/api/video/enabled');
    const data = await res.json();
    videoToggle.hidden = !data.enabled;
  } catch (e) {}
})();

(async function start() {
  setBusy(true);
  try {
    const res = await fetch('/api/start', {method: 'POST'});
    const data = await res.json();
    if (data.reply) addMessage(data.reply, 'facilitator');
    playReplyAudio(data.audio_url);
    handleSignal(data.signal);
  } finally {
    setBusy(false);
  }
})();
</script>
</body>
</html>
