<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mend test conversation history</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17372E; --ink-soft:#3C4C49; --paper:#F6F1E7; --card:#FFFFFF;
    --accent:#17372E; --accent-soft:#EAF0EC; --border:#DDD4C0;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:880px; margin:0 auto; padding:28px 24px 60px;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0 0 24px;}
  .list{display:flex; flex-direction:column; gap:10px;}
  .row{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:12px;}
  .row:hover{border-color:var(--accent);}
  .row-main{display:flex; flex-direction:column; gap:3px;}
  .row-title{font-weight:700; font-size:14.5px;}
  .row-sub{font-size:12.5px; color:var(--ink-soft);}
  .pill{display:inline-block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--accent); margin-right:6px;}
  .score{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:14px; white-space:nowrap;}
  .score .human{color:var(--ink-soft); font-size:12px; display:block; text-align:right;}
  .empty{color:var(--ink-soft); font-size:14px; padding:30px 0;}

  .overlay{display:none; position:fixed; inset:0; background:rgba(23,55,46,.35); padding:20px; overflow-y:auto;}
  .overlay.open{display:block;}
  .panel{max-width:760px; margin:0 auto; background:var(--card); border-radius:18px; padding:26px 26px 30px;}
  .panel-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .close-btn{border:none; background:none; font-size:20px; cursor:pointer; color:var(--ink-soft); line-height:1;}
  .meta-grid{display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; font-size:13px; color:var(--ink-soft); margin:10px 0 18px;}
  .meta-grid b{color:var(--ink);}
  details{border:1px solid var(--border); border-radius:12px; margin-bottom:12px; padding:10px 14px;}
  details summary{cursor:pointer; font-weight:700; font-size:13.5px;}
  pre.prompt{white-space:pre-wrap; font-family:'JetBrains Mono',monospace; font-size:12px; margin:10px 0 0; max-height:300px; overflow-y:auto;}
  .score-metrics{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--ink-soft); margin-top:8px; line-height:1.6;}
  .rationale{font-size:13px; line-height:1.5; margin-top:8px;}
  .turn{border-radius:12px; padding:10px 14px; margin-bottom:8px; font-size:13.5px; line-height:1.5;}
  .turn.user{background:var(--accent-soft);}
  .turn.assistant{background:var(--paper); border:1px solid var(--border);}
  .turn-role{font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:3px;}
  .turn p{margin:0 0 8px;}
  .turn p:last-child{margin-bottom:0;}
  .turn ul{margin:0 0 8px; padding-left:20px;}
  .turn ul:last-child{margin-bottom:0;}
  .rate-box{border-top:1px solid var(--border); margin-top:18px; padding-top:16px;}
  .rate-box h3{font-size:14px; margin:0 0 10px;}
  .name-input{width:100%; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; font:inherit; font-size:13.5px; background:var(--paper); color:var(--ink); margin-bottom:12px;}
  .metric-row{margin-bottom:10px;}
  .metric-label{font-size:13px; font-weight:700; margin-bottom:5px;}
  .scale{display:flex; gap:8px; margin:0 0 4px;}
  .scale button{flex:1; border:1.5px solid var(--border); background:var(--paper); color:var(--ink); border-radius:999px; padding:9px 0; font:inherit; font-weight:700; font-size:14px; cursor:pointer;}
  .scale button.sel{background:var(--accent); color:#fff; border-color:var(--accent);}
  textarea{width:100%; resize:vertical; min-height:60px; border:1.5px solid var(--border); border-radius:10px; padding:10px 12px; font:inherit; font-size:13.5px; background:var(--paper); color:var(--ink); margin-top:4px;}
  button.primary{border:1.5px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:10px 22px; font:inherit; font-weight:700; font-size:14px; cursor:pointer; margin-top:10px;}
  .saved-note{font-size:12.5px; color:var(--ink-soft); margin-top:8px;}
  .ratings-list{display:flex; flex-direction:column; gap:8px; margin-bottom:6px;}
  .rating-card{border:1px solid var(--border); border-radius:10px; padding:10px 12px; font-size:12.5px;}
  .rating-card .rater{font-weight:700; font-size:13px;}
  .rating-card .metrics{color:var(--ink-soft); font-family:'JetBrains Mono',monospace; margin:3px 0;}
  .rating-card .notes{color:var(--ink-soft); font-style:italic;}
  .annotations-list{display:flex; flex-direction:column; gap:10px; margin-bottom:14px;}
  .annotation-card{border:1px solid var(--border); border-radius:10px; padding:12px 14px; font-size:13px;}
  .annotation-card blockquote{margin:0 0 8px; padding:8px 10px; background:var(--accent-soft); border-left:3px solid var(--accent); border-radius:4px; font-size:12.5px; white-space:pre-wrap;}
  .annotation-card .ann-rater{font-weight:700; font-size:12.5px; margin-bottom:3px;}
  .annotation-card .ann-comment{margin-bottom:8px;}
  .annotation-reply{background:var(--paper); border-radius:8px; padding:8px 10px; font-size:12.5px;}
  .reply-label{font-weight:700; color:var(--ink-soft); font-size:11px; text-transform:uppercase; letter-spacing:.03em; margin-bottom:3px;}
  .reply-form{display:flex; gap:6px; margin-top:4px;}
  .reply-form textarea{min-height:36px; margin-top:0;}
  .reply-form button{margin-top:0; padding:0 16px; white-space:nowrap;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Test conversation history</h1>
  <p class="sub">Test-only data from benchmark/comparison harness runs. Not real user sessions.</p>
  <div id="list" class="list"><div class="empty">Loading...</div></div>
</div>

<div id="overlay" class="overlay">
  <div class="panel" id="panel"></div>
</div>

<script>
const BASE_PATH = location.pathname.replace(/\/conversation-history$/, '');
let CURRENT = null;

function fmtTs(ts){
  const d = new Date(ts * 1000);
  return d.toLocaleString();
}

const METRICS = [
  ['feel_equipped', 'Feel equipped'],
  ['feel_understood', 'Feel understood'],
  ['trust_advice', 'Trust the advice'],
  ['would_say_it', 'Would say it'],
];

const JUDGE_LABELS = {
  reality_testing: 'Reality testing',
  structural_attribution: 'Structural attribution',
  diagnostic_restraint: 'Diagnostic restraint',
  actionable_artifact: 'Actionable artifact',
  safety_circuit_breaker: 'Safety circuit breaker',
};

function selfReportAvg(sr){
  const vals = METRICS.map(([k]) => sr[k]).filter(v => v != null);
  if (!vals.length) return null;
  return (vals.reduce((a, b) => a + b, 0) / vals.length).toFixed(1);
}

function scoreText(score){
  if (!score) return '—';
  return score.total != null ? `${score.total}/25` : '—';
}

function ratingsSummary(ratings){
  if (!ratings || !ratings.length) return 'not rated';
  const n = ratings.length;
  const avg = ratings.reduce((sum, r) => sum + METRICS.reduce((s, [k]) => s + (r[k] || 0), 0) / METRICS.length, 0) / n;
  return `${n} rating${n > 1 ? 's' : ''}, avg ${avg.toFixed(1)}/5`;
}

function ratedByText(ratings){
  if (!ratings || !ratings.length) return 'no one yet';
  const names = ratings.map(r => escapeHtml(r.rater));
  return `${ratings.length} person${ratings.length > 1 ? 's' : ''} (${names.join(', ')})`;
}

async function loadList(){
  const res = await fetch(BASE_PATH + '/api/test-conversations');
  const records = await res.json();
  const list = document.getElementById('list');
  if (!records.length){
    list.innerHTML = '<div class="empty">No test conversations logged yet.</div>';
    return;
  }
  list.innerHTML = records.map(r => `
    <div class="row" onclick="openConversation('${r.id}')">
      <div class="row-main">
        <div class="row-title"><span class="pill">${r.system_id}</span>${r.scenario_id}</div>
        <div class="row-sub">${r.prompt_name} &middot; ${fmtTs(r.ts)} &middot; ${r.turns ?? '?'} turns</div>
      </div>
      <div class="score">
        ${scoreText(r.objective_score)}
        <span class="human">${ratingsSummary(r.human_ratings)}${(r.annotations || []).length ? `, ${r.annotations.length} flag${r.annotations.length > 1 ? 's' : ''}` : ''}</span>
      </div>
    </div>
  `).join('');
}

async function openConversation(id){
  const res = await fetch(BASE_PATH + '/api/test-conversations/' + id);
  const r = await res.json();
  CURRENT = r;
  for (const k of Object.keys(PENDING)) delete PENDING[k];
  const score = r.objective_score || {};
  const sr = r.self_report || {};
  const transcriptHtml = (r.transcript || []).map(m => `
    <div class="turn ${m.role}">
      <div class="turn-role">${m.role === 'assistant' ? 'Thimble' : m.role}</div>
      ${renderMarkdown(m.content)}
    </div>
  `).join('');

  document.getElementById('panel').innerHTML = `
    <div class="panel-head">
      <div><span class="pill">${r.system_id}</span><b>${r.scenario_id}</b></div>
      <button class="close-btn" onclick="closePanel()">&times;</button>
    </div>
    <div class="meta-grid">
      <div><b>Prompt:</b> ${r.prompt_name}</div>
      <div><b>Harness:</b> ${r.harness}</div>
      <div><b>Judged score:</b> ${scoreText(score)}</div>
      <div><b>Turns:</b> ${r.turns ?? '?'}</div>
      <div><b>Rated by:</b> ${ratedByText(r.human_ratings)}</div>
    </div>

    ${r.prompt_text ? `<details><summary>Prompt used</summary><pre class="prompt">${escapeHtml(r.prompt_text)}</pre></details>` : ''}

    ${score.scores ? `<details open><summary>Why this score (${scoreText(score)})</summary>
      <div class="score-metrics">${Object.entries(score.scores).map(([k, v]) => `${JUDGE_LABELS[k] || k}: ${v}/5`).join(' &middot; ')}</div>
      ${score.rationale ? `<div class="rationale">${escapeHtml(score.rationale)}</div>` : ''}
    </details>` : ''}

    ${Object.keys(sr).length ? `<details open><summary>How the simulated person said they felt${selfReportAvg(sr) != null ? ` (avg ${selfReportAvg(sr)}/5)` : ''}</summary>
      <div class="score-metrics">${METRICS.filter(([k]) => sr[k] != null).map(([k, label]) => `${label}: ${sr[k]}/5`).join(' &middot; ')}</div>
      ${sr.rationale ? `<div class="rationale">&ldquo;${escapeHtml(sr.rationale)}&rdquo;</div>` : ''}
    </details>` : ''}

    <details open><summary>Transcript</summary>${transcriptHtml}</details>

    <div class="rate-box">
      <h3>Flag specific text (${(r.annotations || []).length})</h3>
      ${(r.annotations || []).length ? `
        <div class="annotations-list">
          ${r.annotations.map(ann => `
            <div class="annotation-card">
              <div class="ann-rater">${escapeHtml(ann.rater)}</div>
              <div class="reply-label">Flagged text</div>
              <blockquote>${escapeHtml(ann.quote)}</blockquote>
              <div class="reply-label">Comment</div>
              <div class="ann-comment">${escapeHtml(ann.comment)}</div>
              ${ann.reply ? `
                <div class="annotation-reply">
                  <div class="reply-label">Reply</div>
                  ${escapeHtml(ann.reply)}
                </div>
              ` : `
                <div class="reply-form">
                  <textarea id="reply-${ann.id}" placeholder="Reply to this..."></textarea>
                  <button class="primary" onclick="submitReply('${r.id}', '${ann.id}')">Reply</button>
                </div>
              `}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <h4 style="font-size:13px; margin:4px 0 8px;">Flag something</h4>
      <input id="ann-name" class="name-input" type="text" placeholder="Your name" value="${escapeHtml(getSavedName())}">
      <textarea id="ann-quote" placeholder="Paste the exact text you're flagging"></textarea>
      <textarea id="ann-comment" placeholder="What's wrong (or right) about it" style="margin-top:8px;"></textarea>
      <button class="primary" onclick="submitAnnotation('${r.id}')">Add flag</button>
      <div class="saved-note" id="ann-saved-note"></div>
    </div>

    <div class="rate-box">
      ${(r.human_ratings || []).length ? `
        <h3>Ratings so far (${r.human_ratings.length})</h3>
        <div class="ratings-list">
          ${r.human_ratings.map(rating => `
            <div class="rating-card">
              <div class="rater">${escapeHtml(rating.rater)}</div>
              <div class="metrics">${METRICS.map(([k, label]) => `${label}: ${rating[k]}`).join(' &middot; ')}</div>
              ${rating.notes ? `<div class="notes">${escapeHtml(rating.notes)}</div>` : ''}
            </div>
          `).join('')}
        </div>
      ` : ''}

      <h3>Add your rating</h3>
      <input id="rate-name" class="name-input" type="text" placeholder="Your name" value="${escapeHtml(getSavedName())}">
      ${METRICS.map(([key, label]) => `
        <div class="metric-row">
          <div class="metric-label">${label}</div>
          <div class="scale" data-metric="${key}">
            ${[1,2,3,4,5].map(n => `<button data-n="${n}" onclick="pickMetric('${key}', ${n})">${n}</button>`).join('')}
          </div>
        </div>
      `).join('')}
      <textarea id="rate-notes" placeholder="Notes (optional)"></textarea>
      <button class="primary" onclick="submitRating('${r.id}')">Save rating</button>
      <div class="saved-note" id="saved-note"></div>
    </div>
  `;
  document.getElementById('overlay').classList.add('open');
}

const PENDING = {};

function pickMetric(key, n){
  PENDING[key] = n;
  document.querySelectorAll(`.scale[data-metric="${key}"] button`).forEach(b => {
    b.classList.toggle('sel', Number(b.dataset.n) === n);
  });
}

async function submitRating(id){
  const rater = document.getElementById('rate-name').value.trim();
  if (!rater){
    document.getElementById('saved-note').textContent = 'Enter your name first.';
    return;
  }
  const missing = METRICS.filter(([key]) => !PENDING[key]);
  if (missing.length){
    document.getElementById('saved-note').textContent = `Rate: ${missing.map(([,l]) => l).join(', ')}.`;
    return;
  }
  const notes = document.getElementById('rate-notes').value;
  const body = {rater, notes, ...PENDING};
  const res = await fetch(BASE_PATH + '/api/test-conversations/' + id + '/rate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  if (res.ok){
    saveName(rater);
    for (const k of Object.keys(PENDING)) delete PENDING[k];
    loadList();
    closePanel();
  } else {
    document.getElementById('saved-note').textContent = 'Failed to save.';
  }
}

async function submitAnnotation(id){
  const rater = document.getElementById('ann-name').value.trim();
  const quote = document.getElementById('ann-quote').value.trim();
  const comment = document.getElementById('ann-comment').value.trim();
  if (!rater || !quote || !comment){
    document.getElementById('ann-saved-note').textContent = 'Name, the pasted text, and a comment are all required.';
    return;
  }
  const res = await fetch(BASE_PATH + '/api/test-conversations/' + id + '/annotate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({rater, quote, comment}),
  });
  if (res.ok){
    saveName(rater);
    document.getElementById('ann-saved-note').textContent = 'Saved.';
    loadList();
    openConversation(id);
  } else {
    document.getElementById('ann-saved-note').textContent = 'Failed to save.';
  }
}

async function submitReply(id, annotationId){
  const reply = document.getElementById('reply-' + annotationId).value.trim();
  if (!reply) return;
  const res = await fetch(BASE_PATH + '/api/test-conversations/' + id + '/annotate/' + annotationId + '/reply', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({reply}),
  });
  if (res.ok){
    openConversation(id);
  }
}

function closePanel(){
  document.getElementById('overlay').classList.remove('open');
  CURRENT = null;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Remembers the rater's name per-browser so it only needs to be typed once,
// for both the rating form and the flag form.
function getSavedName(){
  try { return localStorage.getItem('mend_rater_name') || ''; } catch (e) { return ''; }
}

function saveName(name){
  try { localStorage.setItem('mend_rater_name', name); } catch (e) {}
}

// Minimal markdown for transcript turns -- raw Claude (no system prompt)
// answers in full markdown (bold, bullets); Mend/CF's prompts steer away
// from it, so this only visibly matters for raw's turns, but applies to all
// so every turn renders the same way. Bold, bullet lists, paragraphs only --
// deliberately not a full markdown parser, just enough for what these
// transcripts actually use. Escapes first, so no markdown source can inject
// HTML.
function renderMarkdown(text){
  const escaped = escapeHtml(text);
  const lines = escaped.split('\n');
  const blocks = [];
  let listItems = null;
  for (const line of lines){
    const bullet = line.match(/^\s*[-*]\s+(.*)/);
    if (bullet){
      if (!listItems){ listItems = []; blocks.push(listItems); }
      listItems.push(bullet[1]);
    } else {
      listItems = null;
      blocks.push(line);
    }
  }
  const inline = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return blocks.map(b => {
    if (Array.isArray(b)) return `<ul>${b.map(i => `<li>${inline(i)}</li>`).join('')}</ul>`;
    if (!b.trim()) return '';
    return `<p>${inline(b)}</p>`;
  }).join('');
}

loadList();
</script>
</body>
</html>
