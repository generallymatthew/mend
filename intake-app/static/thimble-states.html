<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thimble states — QA reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /*
    QA reference page for every Thimble avatar state. This is NOT part of
    the real app flow -- nothing here is wired to a mic, TTS audio, or a
    conversation. Each card below runs its own always-on instance of the
    exact same avatar engine static/index.html uses (thimblePolygon,
    THIMBLE_SHAPES, applyThimbleState, renderThimbleMouth -- copied
    verbatim, not reimplemented), with "Auto" sliders standing in for real
    mic/TTS level, so you can eyeball every state side by side without
    going through mic permissions, a live call, or waiting for real TTS to
    land. If the real engine in static/index.html changes, re-copy those
    functions here too -- there's no shared import, by design, so this
    page can never accidentally pull in something that only works inside
    the real call flow (audioCtx, analyser, etc).
  */
  :root{
    --ink:#17372E; --ink-soft:#3C4C49; --paper:#F6F1E7; --card:#FFFFFF;
    --accent:#17372E; --accent-soft:#EAF0EC; --border:#DDD4C0;
    --stage-bg:#FBF8F3;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:1280px; margin:0 auto; padding:28px 24px 60px;}
  h1{font-size:22px; font-weight:800; letter-spacing:-0.01em; margin:0 0 4px;}
  .sub{font-size:13.5px; color:var(--ink-soft); margin:0 0 28px; line-height:1.5; max-width:720px;}
  .sub code{background:#17372E0D; padding:1px 5px; border-radius:4px; font-size:12.5px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px; display:flex; flex-direction:column; gap:12px;}
  .card-stage{position:relative; height:160px; display:flex; align-items:center; justify-content:center; background:var(--stage-bg); border-radius:12px;}
  .card-name{font-weight:700; font-size:15px;}
  .card-pill{display:inline-flex; align-self:flex-start; align-items:center; gap:6px; padding:4px 10px; border-radius:999px; background:var(--accent-soft); font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink);}
  .card-desc{font-size:12.5px; line-height:1.5; color:var(--ink-soft); min-height:48px;}
  .card-controls{display:flex; flex-direction:column; gap:6px; font-size:11.5px; color:var(--ink-soft); border-top:1px solid var(--border); padding-top:10px; margin-top:-2px;}
  .card-controls label{display:flex; align-items:center; gap:6px;}
  .card-controls input[type=range]{flex:1; accent-color:var(--accent);}
  .card-controls .row{display:flex; align-items:center; gap:8px;}

  /* Avatar engine CSS, copied verbatim from static/index.html. */
  .thimble-avatar{position:relative; width:120px; height:120px; transition:transform .7s cubic-bezier(.3,1.4,.5,1), opacity .4s ease;
    filter: drop-shadow(0 8px 12px rgba(23,55,46,.16)) drop-shadow(0 2px 4px rgba(23,55,46,.12));}
  .thimble-avatar.muted{opacity:.5;}
  .thimble-ripple{position:absolute; inset:0; border-radius:50%; background:#F3829A; animation:thimble-ripple 1.6s ease-out infinite;}
  .thimble-ripple.b{animation-delay:.8s;}
  .thimble-ring{position:absolute; inset:0; transform-origin:50% 90%; transition:transform .18s ease-out;}
  /* "Matte Shade" fill, copied verbatim from static/index.html -- see that file's comment for why. */
  .thimble-body{position:absolute; inset:0; border-radius:50%; background:radial-gradient(circle at 50% 40%, #F3829A 0%, #F3829A 45%, #D9607C 85%, #C15372 100%); overflow:hidden; transition:border-radius .6s ease, background .6s ease; will-change:clip-path;}
  .thimble-blend{position:absolute; width:80%; height:80%; left:-38%; top:30%; border-radius:50%; background:#E9B949; mix-blend-mode:multiply; opacity:0; transition:opacity .8s ease;}
  .thimble-mouth{position:absolute; left:50%; transform:translate(-50%,-50%); transition:width .35s ease, height .35s ease, border-radius .35s ease;}
  @keyframes thimble-nod{0%,100%{transform:translateY(6%) scale(1,.88);} 40%{transform:translateY(11%) scale(1,.8);}}
  @keyframes thimble-ripple{0%{transform:scale(1); opacity:.45;} 100%{transform:scale(1.6); opacity:0;}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Thimble states</h1>
  <p class="sub">Every <code>avatarState</code> the real app can be in, running live and side by side, for QA -- no mic, call, or real TTS needed. Sliders marked <b>Auto</b> simulate a mic/TTS level; drag one to freeze it and inspect a specific amplitude.</p>
  <div class="grid" id="grid"></div>
</div>
<script>
// ---- Avatar engine, copied verbatim from static/index.html (see that
// file for the full history/reasoning behind these numbers) ----

// DOME_RADIUS: the "Soft Dome" option picked after comparing four shapes
// against empathizing's own look -- see static/index.html for the full
// writeup. Reused across every state, not just empathizing.
const DOME_RADIUS = '50% 50% 50% 50% / 68% 68% 28% 28%';
const THIMBLE_SHAPES = {
  listening:   {radius: '50% 50% 47% 53% / 68% 68% 28% 28%', anim: 'none', lean: 'rotate(-10deg) translate(2%,1%)', mouthTop: 60, mouthW: .11, mouthH: .028},
  listening2:  {radius: '50% 50% 50% 50% / 50% 50% 50% 50%', anim: 'none', lean: 'none', mouthTop: 60, mouthW: .11, mouthH: .028},
  idle:        {radius: '50% 50% 47% 53% / 68% 68% 28% 28%', anim: 'none', lean: 'rotate(-10deg) translate(2%,1%)', mouthTop: 60, mouthW: .11, mouthH: .028},
  thinking:    {radius: DOME_RADIUS, anim: 'none', lean: 'none', mouthTop: 62, mouthW: .12, mouthH: .07, mouthX: 58},
  talking:     {radius: DOME_RADIUS, anim: 'none', lean: 'none', mouthTop: 63, mouthW: .19, mouthH: .12},
  empathizing: {radius: DOME_RADIUS, anim: 'thimble-nod 2.8s ease-in-out infinite', lean: 'none', mouthTop: 68, mouthW: .22, mouthH: .1},
  paused:      {radius: DOME_RADIUS, anim: 'none', lean: 'none', mouthTop: 60, mouthW: .14, mouthH: .03},
};

// listening2: a new listening shape -- circle at rest, a soft dome as you
// start talking, then the base widens and softens the longer you go. Three
// stages, not a straight blend, with a small wobble riding on top; no lean,
// no tilt, no separate nod. A different idea from DOME_RADIUS/
// domeWobbleRadius above (that one is a continuous dome<->circle cycle) --
// applies to the listening2 card only, added for side-by-side comparison.
function newListeningRadius(t, l) {
  const ease = x => x * x * (3 - 2 * x);
  const lerp = (a, b, p) => a + (b - a) * p;
  const p1 = ease(Math.min(1, l / 0.5));
  const p2 = ease(Math.min(1, Math.max(0, (l - 0.5) / 0.5)));
  const hBot = l <= 0.5 ? lerp(50, 20, p1) : lerp(20, 82, p2);
  const vBot = l <= 0.5 ? lerp(50, 14, p1) : lerp(14, 26, p2);
  const j = (ph, amp) => Math.sin(t * 1.3 + ph) * amp * l;
  const bl = (hBot + j(0, 6)).toFixed(1), br = (hBot + j(1.1, 6)).toFixed(1);
  const tl = (vBot + j(2.3, 5)).toFixed(1), tr = (vBot + j(3.6, 5)).toFixed(1);
  return `50% 50% ${bl}% ${br}% / 50% 50% ${tl}% ${tr}%`;
}

const THIMBLE_WOBBLE_AMOUNT = 2.6;
// See static/index.html's thimblePolygon for the full reasoning (including
// a first, buggy version of this that overflowed the box) -- ported
// verbatim so the live wobble states (listening/thinking/talking) also
// read as dome-shaped, not just the states that render plain border-radius.
const DOME_WOBBLE_BIAS = 0.22;
function thimblePolygon(t, g, lvl, facets, spinSpeed, maxDepth) {
  const N = facets, M = 120, seg = (2 * Math.PI) / N, raw = [];
  const phi = t * spinSpeed + 0.15 * Math.sin(t * 1.7);
  const poly = th => { const m = (((th - phi) % seg) + seg) % seg; return Math.cos(seg / 2) / Math.cos(m - seg / 2); };
  const rawDepth = g * Math.min(1, 0.55 + lvl * 0.6) * THIMBLE_WOBBLE_AMOUNT;
  const depth = Math.min(maxDepth == null ? 1 : maxDepth, rawDepth);
  const jitterScale = rawDepth > 0 ? depth / rawDepth : 1;
  for (let i = 0; i < M; i++) {
    const th = (i / M) * 2 * Math.PI;
    let sum = 0; for (let w = -6; w <= 6; w++) sum += poly(th + (w / 6) * seg * 0.32);
    const smooth = sum / 13;
    const jitter = 1 + jitterScale * (0.05 * g * lvl * Math.sin(th * N + t * 5) + 0.03 * g * lvl * Math.sin(th * N * 0.5 - t * 3.2));
    const dome = 1 - DOME_WOBBLE_BIAS * Math.max(0, -Math.sin(th));
    const r = 50 * (1 - depth * (1 - smooth)) * jitter * dome;
    raw.push([50 + r * Math.cos(th), 50 + r * Math.sin(th)]);
  }
  // See static/index.html's thimblePolygon for the full reasoning --
  // re-centers the outline on its own true bounding box, since dome's
  // shrink-only-at-the-top leaves the shape's visual weight sitting low.
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const [x, y] of raw) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
  const dx = 50 - (minX + maxX) / 2, dy = 50 - (minY + maxY) / 2;
  const pts = raw.map(([x, y]) => `${(x + dx).toFixed(2)}% ${(y + dy).toFixed(2)}%`);
  return `polygon(${pts.join(',')})`;
}

// Every active state's wobble -- see static/index.html's domeWobbleRadius
// for the full reasoning. Interpolates DOME_RADIUS's own vertical cap/rim
// percentages between the resting dome (domeFactor 1) and a perfect circle
// (domeFactor 0); no hexagon clip-path anywhere anymore.
function domeWobbleRadius(domeFactor, lvl) {
  const capY = 50 + (18 + 4 * lvl) * domeFactor;
  const rimY = 50 - (22 + 4 * lvl) * domeFactor;
  return `50% 50% 50% 50% / ${capY.toFixed(1)}% ${capY.toFixed(1)}% ${rimY.toFixed(1)}% ${rimY.toFixed(1)}%`;
}

function renderThimbleMouth(inst, state) {
  const shape = THIMBLE_SHAPES[state] || THIMBLE_SHAPES.listening;
  const s = inst.size;
  inst.mouth.style.top = shape.mouthTop + '%';
  inst.mouth.style.left = (shape.mouthX || 50) + '%';
  inst.mouth.className = 'thimble-mouth';
  inst.mouth.innerHTML = '';
  inst.mouth.style.width = (shape.mouthW * s) + 'px';
  inst.mouth.style.height = (shape.mouthH * s) + 'px';
  inst.mouth.style.boxSizing = 'border-box';
  if (state === 'empathizing') {
    inst.mouth.style.background = 'none';
    inst.mouth.style.borderBottom = (0.028 * s) + 'px solid #F6F1E7';
    inst.mouth.style.borderRadius = '0 0 999px 999px';
  } else {
    inst.mouth.style.background = '#F6F1E7';
    inst.mouth.style.borderBottom = 'none';
    inst.mouth.style.borderRadius = (state === 'talking' || state === 'thinking') ? '50%' : '999px';
  }
}

function applyThimbleState(inst, state) {
  if (state === inst.renderedState) return;
  inst.renderedState = state;
  const shape = THIMBLE_SHAPES[state] || THIMBLE_SHAPES.listening;
  inst.el.style.transform = shape.lean;
  inst.body.style.animation = shape.anim;
  inst.body.style.borderRadius = shape.radius;
  inst.blend.style.opacity = state === 'empathizing' ? '.85' : '0';
  inst.body.style.background = state === 'paused' ? '#A9A39A' : '';
  const talking = state === 'talking';
  inst.rippleA.hidden = !talking;
  inst.rippleB.hidden = !talking;
  inst.mouth.style.transition = talking ? 'width .35s ease, border-radius .35s ease' : '';
  renderThimbleMouth(inst, state);
}

// Adapted from static/index.html's updateThimbleMotion: that version reads
// a single global avatarState/micMuted/analyser (one real call has one
// Thimble); this page runs many fixed-state instances at once, so state,
// level and muted come in as plain arguments instead.
function updateCardMotion(inst, now, state, level, muted) {
  applyThimbleState(inst, state);
  const speaking = state === 'talking';
  const thinkingState = state === 'thinking';
  const listening = state === 'listening';
  const listening2 = state === 'listening2';
  inst.el.classList.toggle('muted', muted && (listening || listening2) && !speaking && !thinkingState);
  const ttsLevel = speaking ? level : 0;
  const active = listening || listening2 || speaking || thinkingState;
  if (!active) { inst.ring.style.transform = 'none'; inst.body.style.clipPath = 'none'; inst.geo = 0; inst.lvl = 0; }
  else {
    const nodding = listening;
    const y = nodding ? 4 * Math.pow(Math.max(0, Math.sin((2 * Math.PI * (now / 1000)) / 2.6)), 1.5) : 0;
    const wiggle = thinkingState ? (-10 + 2 * Math.sin((now / 1000) * 1.2)) : 0;
    const breathePeriod = nodding ? 3 : speaking ? 2.2 : thinkingState ? 3 : listening2 ? 3 : 4.5;
    const breathe = 1 + 0.035 * (1 - Math.cos((2 * Math.PI * (now / 1000)) / breathePeriod));
    inst.ring.style.transform = `translateY(${y.toFixed(2)}%) rotate(${wiggle.toFixed(2)}deg) scale(${breathe.toFixed(4)})`;
    const input = speaking ? ttsLevel : thinkingState ? 0.15 : level;
    inst.lvl += (input - inst.lvl) * (speaking ? 0.45 : 0.3);
    inst.body.style.clipPath = 'none';
    if (listening2) {
      inst.body.style.borderRadius = newListeningRadius(now / 1000, inst.lvl);
    } else {
      const wobblePeriod = thinkingState ? 3.4 : 1.6;
      const domePhase = ((now / 1000) % wobblePeriod) / wobblePeriod;
      const domeFactor = (1 + Math.cos(domePhase * 2 * Math.PI)) / 2;
      inst.body.style.borderRadius = domeWobbleRadius(domeFactor, inst.lvl);
      if (speaking) {
        const rippleFracA = (domePhase - 0.5 + 1) % 1;
        const rippleFracB = (rippleFracA + 0.5) % 1;
        const ringRadius = inst.body.style.borderRadius;
        const ringTransform = inst.ring.style.transform;
        [[inst.rippleA, rippleFracA], [inst.rippleB, rippleFracB]].forEach(([el, frac]) => {
          el.style.animation = 'none';
          el.style.borderRadius = ringRadius;
          el.style.transform = `${ringTransform} scale(${(1 + 0.6 * frac).toFixed(3)})`;
          el.style.opacity = (0.45 * (1 - frac)).toFixed(3);
        });
      }
    }
  }
  if (speaking) {
    const rate = ttsLevel > inst.mouthLevel ? 0.7 : 0.25;
    inst.mouthLevel += (ttsLevel - inst.mouthLevel) * rate;
    // Capped at 70% of the mouth's fixed width -- see static/index.html's
    // updateThimbleMotion for the full reasoning (uncapped, a loud peak
    // turned the oval into a near-circle white hole).
    const maxH = THIMBLE_SHAPES[state].mouthW * inst.size * 0.7;
    inst.mouth.style.height = Math.min(inst.size * (0.03 + 0.22 * inst.mouthLevel), maxH) + 'px';
  } else {
    inst.mouthLevel = 0;
  }
}

// ---- QA page scaffolding (not part of the real app) ----

const STATE_WORDS = {idle: 'Listening…', listening: 'Listening…', listening2: 'Listening…', thinking: 'Thinking…', talking: 'Talking…', empathizing: 'Empathizing…', paused: 'Paused'};

const STATES = [
  {state: 'idle', title: 'Idle', desc: 'Before the call has really started -- same resting egg shape as listening, just no live mic input yet.', hasLevel: false, hasMuted: true},
  {state: 'listening', title: 'Listening', desc: 'Leans in, egg-shaped, wobbles with mic level. Continuous nod the whole time, not just on speech.', hasLevel: true, hasMuted: true},
  {state: 'listening2', title: 'Listening — new (circle → dome → base)', desc: 'Circle at rest; a soft dome as you start talking; the base widens and softens the longer you go. Three stages, not a straight blend, with a small wobble riding on top. No lean, no tilt, no separate nod.', hasLevel: true, hasMuted: true},
  {state: 'thinking', title: 'Thinking', desc: 'Round blob with a slow head-tilt wiggle. Small off-center oval mouth, no movement. Covers transcribing and waiting on the reply both -- no separate states for those anymore.', hasLevel: false, hasMuted: false},
  {state: 'talking', title: 'Talking', desc: 'Round, ripples outward. Mouth height tracks TTS amplitude directly (fast attack, slower release) instead of a canned loop.', hasLevel: true, hasMuted: false},
  {state: 'empathizing', title: 'Empathizing', desc: 'Slow nod, soft closed-mouth smile, honey blend fades in from the side. Not wired to a real trigger yet.', hasLevel: false, hasMuted: false},
  {state: 'paused', title: 'Paused', desc: 'Frozen (no breathing/wobble) and recolored grey, so a paused session reads as deliberately stopped, not stuck.', hasLevel: false, hasMuted: false},
];

const grid = document.getElementById('grid');
const cards = STATES.map(def => {
  const card = document.createElement('div');
  card.className = 'card';
  const uid = 'av_' + def.state;
  card.innerHTML = `
    <div class="card-stage">
      <div class="thimble-avatar" id="${uid}">
        <div class="thimble-ripple" id="${uid}RippleA" hidden></div>
        <div class="thimble-ripple b" id="${uid}RippleB" hidden></div>
        <div class="thimble-ring" id="${uid}Ring">
          <div class="thimble-body" id="${uid}Body">
            <div class="thimble-blend" id="${uid}Blend"></div>
            <div class="thimble-mouth" id="${uid}Mouth"></div>
          </div>
        </div>
      </div>
    </div>
    <div>
      <div class="card-name">${def.title}</div>
      <div class="card-pill">avatarState: ${def.state}</div>
    </div>
    <div class="card-desc">${def.desc}<br><i>Pill label: “${STATE_WORDS[def.state]}”</i></div>
    <div class="card-controls"></div>
  `;
  grid.appendChild(card);

  const inst = {
    size: 120,
    el: document.getElementById(uid),
    ring: document.getElementById(uid + 'Ring'),
    body: document.getElementById(uid + 'Body'),
    blend: document.getElementById(uid + 'Blend'),
    mouth: document.getElementById(uid + 'Mouth'),
    rippleA: document.getElementById(uid + 'RippleA'),
    rippleB: document.getElementById(uid + 'RippleB'),
    renderedState: null, mouthLevel: 0, geo: 0, lvl: 0,
  };

  const c = { def, inst, level: 0, auto: true, muted: false, phase: Math.random() * 10 };
  const controls = card.querySelector('.card-controls');

  if (def.hasLevel) {
    controls.innerHTML += `
      <div class="row"><label style="flex:1"><input type="checkbox" class="autoChk" checked> Auto</label></div>
      <div class="row"><input type="range" class="levelSlider" min="0" max="100" value="0"></div>
    `;
    const autoChk = controls.querySelector('.autoChk');
    const slider = controls.querySelector('.levelSlider');
    autoChk.addEventListener('change', () => { c.auto = autoChk.checked; });
    slider.addEventListener('input', () => { c.auto = false; autoChk.checked = false; c.level = slider.value / 100; });
    c._slider = slider;
  }
  if (def.hasMuted) {
    controls.innerHTML += `<div class="row"><label><input type="checkbox" class="mutedChk"> Muted</label></div>`;
    controls.querySelector('.mutedChk').addEventListener('change', e => { c.muted = e.target.checked; });
  }
  if (!def.hasLevel && !def.hasMuted) {
    controls.style.display = 'none';
  }
  return c;
});

function tick(now) {
  cards.forEach(c => {
    if (c.def.hasLevel && c.auto) {
      // A bursty, speech-like level: layered sines + a slow on/off envelope
      // per card (own random phase) so cards don't all pulse in lockstep.
      const t = now / 1000 + c.phase;
      const envelope = Math.max(0, Math.sin(t * 0.6));
      const chatter = 0.5 + 0.5 * Math.sin(t * 7) * Math.sin(t * 2.3);
      c.level = Math.max(0, Math.min(1, envelope * chatter));
      if (c._slider) c._slider.value = Math.round(c.level * 100);
    }
    updateCardMotion(c.inst, now, c.def.state, c.level, c.muted);
  });
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
