<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mend post-session (local prototype)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 871 616'%3E%3Cpath d='M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z' fill='%2317372E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Mend brand kit: Pink mark, Evergreen ink + primary buttons/your
       bubbles, Honey for highlights, Oat paper/facilitator bubbles. Pink
       stays off general chrome -- reserved for the mark and the rare
       single accent CTA (fails WCAG as text/fill on Oat at this lightness). */
    --pink:#F3829A; --ink:#17372E; --ink-soft:#3C4C49; --honey:#E9B949;
    --paper:#F6F1E7; --card:#FFFFFF;
    --accent:#17372E; --accent-soft:#EAF0EC;
    --border:#17372E1F; --border-soft:#17372E14;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:680px; margin:0 auto; padding:20px 16px; display:flex; flex-direction:column; height:100vh;}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand svg{height:17px; width:auto; display:block;}
  .brand span{font-weight:800; font-size:16px; letter-spacing:-0.03em;}
  .brand .sub{font-weight:500; font-size:12.5px; letter-spacing:0; color:var(--ink-soft); margin-left:2px;}
  .privacy-pill{display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; background:var(--accent-soft); font-size:12px; font-weight:500; color:var(--ink-soft); white-space:nowrap;}
  .privacy-pill svg{flex-shrink:0;}
  .setup{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; display:flex; flex-direction:column; gap:12px;}
  .setup label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; opacity:.75; display:block; margin-bottom:6px;}
  .setup select, .setup input{width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:10px; font:inherit; font-size:13px; background:var(--paper); color:var(--ink);}
  .setup select:focus, .setup input:focus{outline:none; border-color:var(--ink); background:var(--card);}
  .setup-row{display:flex; gap:10px;}
  .setup-row > div{flex:1;}
  button.start{align-self:flex-start; background:var(--accent); color:var(--paper); border:none; border-radius:999px; padding:10px 20px; font:inherit; font-weight:700; cursor:pointer; font-size:13.5px;}
  button.start:hover{opacity:.9;}
  .signal{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 11px; margin-bottom:10px; white-space:pre-wrap;}
  .thread{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-bottom:16px;}
  .msg-wrap{display:flex; flex-direction:column; gap:3px; max-width:80%;}
  .msg-wrap.facilitator{align-items:flex-start; align-self:flex-start;}
  .msg-wrap.employee{align-items:flex-end; align-self:flex-end;}
  .msg-sender{font-size:11px; font-weight:600; opacity:.55; padding:0 4px;}
  .msg{padding:12px 15px; border-radius:14px; line-height:1.55; font-size:14.5px; white-space:pre-wrap;}
  .msg.facilitator{background:var(--paper); border:1px solid var(--border); color:var(--ink); border-bottom-left-radius:4px;}
  .msg.employee{background:var(--accent); color:var(--paper); border-bottom-right-radius:4px;}
  .msg.transcript{font-style:italic; opacity:.75;}
  .composer{display:flex; gap:8px; align-items:flex-end; border-top:1px solid var(--border); padding-top:14px;}
  textarea{flex:1; resize:none; border:1.5px solid var(--border); border-radius:14px; padding:11px 14px; font:inherit; font-size:14.5px; background:var(--card); color:var(--ink);}
  textarea:focus{outline:none; border-color:var(--ink);}
  button{border:1px solid var(--border); background:var(--card); color:var(--ink); border-radius:999px; padding:10px 16px; font:inherit; font-weight:700; cursor:pointer; font-size:13.5px; transition:opacity .15s, border-color .15s;}
  button:hover{border-color:var(--ink);}
  button.primary{background:var(--accent); color:var(--paper); border-color:var(--accent);}
  button.primary:hover{opacity:.9;}
  button:disabled{opacity:.5; cursor:default;}
  #recordBtn{width:44px; height:44px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0; border-radius:999px;}
  .status{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:6px;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 871 616" xmlns="http://www.w3.org/2000/svg"><path d="M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z" fill="#F3829A"></path></svg>
      <span>mend</span>
      <span class="sub">Post-session follow-up</span>
    </div>
    <div class="privacy-pill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Private. Nothing is recorded.
    </div>
  </header>

  <div class="setup" id="setup">
    <div class="setup-row">
      <div>
        <label>Escalation status</label>
        <select id="escalation">
          <option value="none">Nothing escalated</option>
          <option value="own_conduct">This employee's own conduct escalated</option>
          <option value="other_party_conduct">The other party's conduct escalated</option>
        </select>
      </div>
      <div>
        <label>Category (if escalated)</label>
        <select id="category">
          <option value="harassment_discrimination">Harassment / discrimination</option>
          <option value="threats_violence">Threats / violence</option>
          <option value="illegal_activity">Illegal activity</option>
          <option value="immediate_safety_risk">Immediate safety risk</option>
        </select>
      </div>
    </div>
    <div>
      <label>Context (optional -- what happened in the joint session)</label>
      <input id="context" type="text" placeholder="e.g. both people got to air their side, no apology happened live">
    </div>
    <button class="start" id="startBtn">Start follow-up</button>
  </div>

  <div class="signal" id="signal" hidden>no signal yet</div>
  <div class="thread" id="thread"></div>
  <div class="composer" id="composer" hidden>
    <textarea id="input" rows="2" placeholder="Type a message..."></textarea>
    <button id="recordBtn" title="Record a voice memo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
    <button id="sendBtn" class="primary">Send</button>
  </div>
  <div class="status" id="status"></div>
</div>

<script>
// Path-relative, not hardcoded absolute: this page is served at "/"
// standalone (direct port) but at "/post/" behind the local Caddy proxy
// (../Caddyfile). fetch('/api/...') and a server-returned "/api/audio/..."
// URL are both absolute paths that would otherwise resolve against the
// proxy's root instead of this app.
const BASE_PATH = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
function apiPath(p) { return BASE_PATH + p.replace(/^\//, ''); }

const setupEl = document.getElementById('setup');
const composerEl = document.getElementById('composer');
const signalEl = document.getElementById('signal');
const thread = document.getElementById('thread');
const statusEl = document.getElementById('status');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const recordBtn = document.getElementById('recordBtn');
const startBtn = document.getElementById('startBtn');
const audioEl = new Audio();

function addMessage(text, cls) {
  const side = cls.indexOf('employee') !== -1 ? 'employee' : 'facilitator';
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + side;
  const sender = document.createElement('div');
  sender.className = 'msg-sender';
  sender.textContent = side === 'employee' ? 'You' : 'Thimble';
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  wrap.appendChild(sender);
  wrap.appendChild(div);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

function playReplyAudio(url) {
  if (!url) return;
  audioEl.src = apiPath(url);
  audioEl.play().catch(() => {});
}

// Reply text now arrives without audio -- see server.py's facilitator_reply
// docstring. Fetches audio in a second round trip, not awaited by callers,
// so the input re-enables as soon as text arrives instead of waiting on
// voice too.
async function speakReply(text) {
  if (!text) return;
  statusEl.textContent = 'generating voice...';
  let audioUrl = null;
  try {
    const res = await fetch(apiPath('/api/speak'), {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    audioUrl = data.audio_url || null;
  } catch (e) {
    // no audio -- playReplyAudio(null) below is already a no-op
  }
  if (statusEl.textContent === 'generating voice...') statusEl.textContent = '';
  playReplyAudio(audioUrl);
}

function renderSignal(signal) {
  if (!signal) return;
  try {
    signalEl.textContent = JSON.stringify(JSON.parse(signal));
  } catch (e) {
    signalEl.textContent = signal;
  }
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  statusEl.textContent = busy ? 'facilitator is responding...' : '';
}

(function prefillFromQuery() {
  const params = new URLSearchParams(location.search);
  const escalation = params.get('escalation');
  const category = params.get('category');

  const escalationSelect = document.getElementById('escalation');
  if (escalation && [...escalationSelect.options].some(o => o.value === escalation)) {
    escalationSelect.value = escalation;
  }

  const categorySelect = document.getElementById('category');
  if (category && [...categorySelect.options].some(o => o.value === category)) {
    categorySelect.value = category;
  }
})();

startBtn.addEventListener('click', async () => {
  const escalation = document.getElementById('escalation').value;
  const category = document.getElementById('category').value;
  const context = document.getElementById('context').value.trim();

  setupEl.hidden = true;
  composerEl.hidden = false;
  signalEl.hidden = false;
  setBusy(true);
  try {
    const res = await fetch(apiPath('/api/start'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({escalation, category, context}),
    });
    const data = await res.json();
    if (data.reply) addMessage(data.reply, 'facilitator');
    renderSignal(data.signal);
    speakReply(data.reply);
  } finally {
    setBusy(false);
  }
});

async function sendText() {
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMessage(text, 'employee');
  setBusy(true);
  try {
    const res = await fetch(apiPath('/api/message'), {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text}),
    });
    const data = await res.json();
    if (data.reply) addMessage(data.reply, 'facilitator');
    renderSignal(data.signal);
    speakReply(data.reply);
  } catch (e) {
    statusEl.textContent = 'error: ' + e.message;
  } finally {
    setBusy(false);
  }
}

sendBtn.addEventListener('click', sendText);
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});

let mediaRecorder = null;
let chunks = [];

async function toggleRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    return;
  }
  const stream = await navigator.mediaDevices.getUserMedia({audio: true});
  mediaRecorder = new MediaRecorder(stream);
  chunks = [];
  mediaRecorder.ondataavailable = (e) => chunks.push(e.data);
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    recordBtn.style.background = '';
    recordBtn.style.color = '';
    recordBtn.style.borderColor = '';
    const blob = new Blob(chunks, {type: 'audio/webm'});
    addMessage('[voice memo]', 'employee transcript');
    setBusy(true);
    statusEl.textContent = 'transcribing...';
    try {
      const form = new FormData();
      form.append('file', blob, 'memo.webm');
      const res = await fetch(apiPath('/api/voice'), {method: 'POST', body: form});
      const data = await res.json();
      if (data.error) {
        statusEl.textContent = data.error;
      } else {
        if (data.transcript) addMessage('"' + data.transcript + '"', 'employee transcript');
        if (data.reply) addMessage(data.reply, 'facilitator');
        renderSignal(data.signal);
        speakReply(data.reply);
      }
    } catch (e) {
      statusEl.textContent = 'error: ' + e.message;
    } finally {
      setBusy(false);
    }
  };
  mediaRecorder.start();
  recordBtn.style.background = 'var(--pink)';
  recordBtn.style.color = '#fff';
  recordBtn.style.borderColor = 'var(--pink)';
}

recordBtn.addEventListener('click', toggleRecording);
</script>
</body>
</html>
