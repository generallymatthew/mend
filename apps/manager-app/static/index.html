<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seam: manager cases</title>
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon.svg">
<meta name="theme-color" content="#2F5233">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root {
    --ink: #1D2E22;
    --bg: #FFFFFF;
    --panel-bg: #EAF0EC;
    --border: #D7E6DC;
    --muted: #74897C;
    --faint: #9FB0A4;
    --accent: #2F5233;
    --bubble: #DCEAE0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #app { display: flex; flex: 1; min-height: 0; }

  /* One persistent top nav bar spanning the whole app, same pattern as
     ../intake-app/static/session.html's .top-nav: brand
     lockup + a privacy chip on the left, global actions on the right --
     rather than the brand/New case/Help controls living inside the
     sidebar's own header. */
  .top-nav {
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .top-bar-brand { display: flex; align-items: center; gap: 9px; }
  .top-bar-brand .mend-mark { display: block; flex-shrink: 0; }
  .top-bar-brand .brand-name { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  .privacy-chip {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; letter-spacing: 0.02em; color: var(--accent);
    background: #2F523314; border-radius: 999px; padding: 8px 14px 8px 10px;
  }
  .privacy-chip svg { flex-shrink: 0; color: var(--accent); }
  .top-nav-actions { display: flex; align-items: center; gap: 8px; }
  #new-case-btn, #help-btn {
    width: 28px; height: 28px; border-radius: 999px;
    background: var(--panel-bg); color: #33453A;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer; border: none;
  }
  #help-btn { font-size: 13px; font-weight: 600; color: var(--muted); }
  #sidebar-toggle {
    width: 28px; height: 28px; border-radius: 999px; flex-shrink: 0;
    background: var(--panel-bg); color: #33453A;
    display: none; align-items: center; justify-content: center;
    font-size: 15px; cursor: pointer; border: none;
  }
  #plan-toggle {
    display: none;
    font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  #plan-toggle:hover { background: var(--panel-bg); }
  .panel-scrim { display: none; }

  /* Conversations list */
  #sidebar {
    width: 300px;
    min-width: 220px;
    border-right: 1px solid var(--border);
    background: var(--bg);
    display: flex;
    flex-direction: column;
  }
  #sidebar-subheader {
    padding: 16px 20px 12px 20px; font-size: 12px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em;
  }

  /* Help modal */
  #help-overlay {
    display: none; position: fixed; inset: 0; background: rgba(43, 42, 39, 0.35);
    align-items: center; justify-content: center; z-index: 10;
  }
  #help-overlay.open { display: flex; }
  #help-modal {
    width: 420px; max-width: calc(100vw - 48px); max-height: calc(100vh - 48px);
    overflow: auto; background: #fff; border-radius: 14px; padding: 28px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.18);
  }
  #help-modal .brand { display: flex; align-items: center; gap: 7px; margin: 0 0 10px 0; }
  #help-modal .mend-mark { display: block; flex-shrink: 0; }
  #help-modal .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
  #help-modal h1 { font-size: 14px; font-weight: 600; color: var(--muted); margin: 0 0 8px 0; }
  #help-modal .close-help {
    float: right; border: none; background: none; color: var(--faint);
    font-size: 18px; cursor: pointer; line-height: 1; margin-left: 12px;
  }
  #case-list { flex: 1; overflow: auto; }
  .case-row {
    padding: 14px 20px;
    display: flex; flex-direction: column; gap: 3px;
    border-bottom: 1px solid #E3EDE6;
    cursor: pointer;
  }
  .case-row.active { background: #DCEAE0; border-left: 3px solid var(--accent); }
  .case-row .top { display: flex; justify-content: space-between; gap: 8px; }
  .case-row .name { font-size: 14px; font-weight: 600; }
  .case-row .time { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .case-row .preview {
    font-size: 13px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .case-row.closed { opacity: 0.55; }
  #sidebar-footer {
    margin-top: auto; padding: 16px 20px; font-size: 12px;
    color: var(--faint); border-top: 1px solid #E3EDE6;
  }

  /* Thread */
  #thread-col { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #F5F8F6; }
  #thread-header {
    padding: 20px 32px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  #thread-header .name { font-size: 16px; font-weight: 600; min-width: 0; }
  #close-case-btn {
    font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--border);
    border-radius: 999px; padding: 6px 14px; cursor: pointer;
    white-space: nowrap; flex-shrink: 0;
  }
  #close-case-btn:hover { background: var(--panel-bg); }
  #thread-header .actions { display: flex; gap: 8px; flex-shrink: 0; }
  #handoff-banner {
    margin: 0 32px; margin-top: 16px; padding: 14px 16px; border-radius: 10px;
    background: #DCEAE0; border: 1px solid #CFE3D6; font-size: 13px; display: none;
  }
  #handoff-banner .title { font-weight: 600; margin-bottom: 6px; }
  #handoff-banner .desc { color: var(--muted); margin-bottom: 10px; }
  #handoff-banner .links { display: flex; flex-direction: column; gap: 6px; }
  #handoff-banner .link-row { display: flex; align-items: center; gap: 8px; }
  #handoff-banner .link-row label { width: 90px; color: var(--muted); flex-shrink: 0; }
  #handoff-banner .link-row input {
    flex: 1; border: 1px solid #D7E6DC; border-radius: 6px; padding: 5px 8px;
    font-size: 12px; font-family: inherit; background: #fff;
  }
  #handoff-banner .link-row button {
    border: 1px solid #CFE3D6; background: #fff; border-radius: 6px; padding: 5px 10px;
    font-size: 12px; cursor: pointer;
  }
  #start-handoff-btn {
    font-size: 13px; color: #fff; background: var(--accent); border: none;
    border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  #messages {
    flex: 1; overflow: auto; padding: 24px 32px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .bubble {
    max-width: 560px; border-radius: 14px; padding: 12px 16px;
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
  }
  .bubble.assistant { align-self: flex-start; background: var(--bubble); }
  .bubble.user { align-self: flex-end; background: var(--accent); color: #fff; }
  .bubble.pending { opacity: 0.5; }
  .employee-tag {
    display: inline-block; background: #211F1C; color: #fff; border-radius: 4px;
    padding: 1px 7px; font-weight: 600; font-size: 0.92em; cursor: pointer;
  }
  .employee-tag:hover { background: #3B3A35; }
  .employee-tag.just-redacted { animation: redact-reveal 650ms ease; }
  @keyframes redact-reveal {
    0% { background: #000; color: transparent; }
    55% { background: #000; color: transparent; }
    100% { background: #211F1C; color: #fff; }
  }
  .employee-tooltip {
    position: fixed; z-index: 50; background: #211F1C; color: #fff; font-size: 12px;
    padding: 7px 11px; border-radius: 7px; max-width: 220px; line-height: 1.4;
    box-shadow: 0 6px 20px rgba(0,0,0,0.25);
  }
  #empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 40px; overflow: auto;
  }
  #empty-state .wrap { max-width: 440px; text-align: center; }
  #empty-state .mark {
    width: 44px; height: 44px; border-radius: 999px; background: var(--accent);
    margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center;
    color: #fff;
  }
  #empty-state .mark svg { width: 20px; height: 14px; }
  #empty-state h1 { font-size: 18px; font-weight: 600; margin: 0 0 8px 0; }
  #empty-state p.lede { font-size: 14px; color: var(--muted); line-height: 1.5; margin: 0 0 28px 0; }
  .flow-steps {
    display: flex; flex-direction: column; gap: 12px; text-align: left;
    margin: 0 0 28px 0; padding: 18px 20px; background: var(--panel-bg);
    border: 1px solid var(--border); border-radius: 12px;
  }
  .flow-step-item { display: flex; gap: 12px; align-items: baseline; }
  .flow-step-item .n {
    width: 18px; height: 18px; border-radius: 999px; background: #fff; border: 1px solid #CBDBD1;
    color: var(--muted); font-size: 11px; font-weight: 600; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .flow-step-item .t { font-size: 13px; line-height: 1.45; }
  .flow-step-item .t b { font-weight: 600; }
  .privacy-note {
    font-size: 12px; color: var(--faint); line-height: 1.5; margin: 0 0 24px 0;
  }
  #empty-state-cta {
    font-size: 14px; font-weight: 600; color: #fff; background: var(--accent);
    border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer;
  }
  #empty-state.returning .flow-steps, #empty-state.returning .privacy-note { display: none; }
  #empty-state.returning h1 { font-size: 15px; font-weight: 600; color: var(--muted); }
  #empty-state.returning .mark { display: none; }
  #empty-state.returning p.lede { display: none; }
  #composer-row {
    padding: 16px 32px 24px 32px; border-top: 1px solid var(--border);
    display: flex; gap: 10px;
  }
  #composer {
    flex: 1; border: 1px solid #D7E6DC; border-radius: 20px; background: var(--panel-bg);
    padding: 11px 16px; font-size: 14px; resize: none; font-family: inherit;
    max-height: 120px;
  }
  #mic-btn {
    width: 40px; height: 40px; border-radius: 999px; background: var(--panel-bg);
    border: 1px solid #D7E6DC; color: var(--muted); display: flex; align-items: center;
    justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  #mic-btn.recording {
    background: #E85D4A; border-color: #E85D4A; color: #fff;
  }
  #send-btn {
    width: 40px; height: 40px; border-radius: 999px; background: var(--accent);
    border: none; display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled { opacity: 0.5; cursor: default; }

  /* Plan panel */
  #plan-panel {
    width: 260px; min-width: 220px; border-left: 1px solid var(--border);
    background: var(--panel-bg); display: flex; flex-direction: column;
  }
  #plan-header {
    padding: 20px 20px 14px 20px; display: flex; align-items: center; justify-content: space-between;
  }
  #plan-header .title { font-size: 13px; font-weight: 600; color: #44584B; }
  #incident-section {
    padding: 18px 20px; border-bottom: 1px solid var(--border);
  }
  #incident-section .title { font-size: 13px; font-weight: 600; color: #44584B; margin-bottom: 6px; }
  #incident-text { font-size: 13px; line-height: 1.45; color: var(--ink); }
  #incident-text.placeholder { color: var(--faint); font-style: italic; }
  #plan-steps { padding: 0 20px; display: flex; flex-direction: column; gap: 16px; overflow: auto; flex: 1; }
  .step { display: flex; flex-direction: column; gap: 6px; }
  .step-label {
    font-size: 10px; font-weight: 700; color: var(--faint); text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .step-added-by {
    margin-left: 6px; font-weight: 600; color: #8FA88A; text-transform: none;
  }
  .step .row { display: flex; gap: 10px; align-items: flex-start; }
  .step .check {
    margin-top: 2px; width: 16px; height: 16px; border-radius: 999px; flex-shrink: 0; cursor: pointer;
    border: 1.5px solid #C1D6C8; display: flex; align-items: center; justify-content: center;
  }
  .step.done .check { background: var(--accent); border-color: var(--accent); }
  .step.done .check svg { display: block; }
  .step:not(.done) .check svg { display: none; }
  .step-text {
    flex: 1; font-size: 13px; line-height: 1.4; outline: none;
    border-radius: 4px; padding: 1px 3px;
  }
  .step-text:focus { background: #fff; }
  .step.done .step-text { color: var(--muted); text-decoration: line-through; }
  .step-note {
    margin-left: 26px; font-size: 12px; line-height: 1.4; color: var(--muted);
    font-style: italic; outline: none; min-height: 14px;
  }
  .step-note:empty::before { content: attr(data-placeholder); color: var(--faint); font-style: normal; }
  #add-step-row { display: flex; gap: 8px; align-items: center; padding: 14px 20px 20px 20px; }
  #add-step-row input {
    flex: 1; border: 1px solid #D7E6DC; border-radius: 6px; padding: 7px 10px;
    font-size: 13px; font-family: inherit;
  }
  #add-step-row button {
    border: none; background: none; color: var(--faint); font-size: 16px; cursor: pointer;
  }

  /* Mobile: cases and plan become off-canvas drawers either side of the
     thread, instead of three columns squeezed into one screen. Cases
     opens by default on load; plan opens via a toggle in the thread
     header. */
  @media (max-width: 860px) {
    #app { position: relative; overflow: hidden; }

    #sidebar {
      position: absolute; top: 0; bottom: 0; left: 0;
      width: 85%; max-width: 320px; z-index: 30;
      box-shadow: 2px 0 16px rgba(29,46,34,0.16);
      transform: translateX(0); transition: transform .25s ease;
    }
    #sidebar.closed { transform: translateX(-100%); }

    #plan-panel {
      position: absolute; top: 0; bottom: 0; right: 0;
      width: 85%; max-width: 340px; z-index: 30;
      box-shadow: -2px 0 16px rgba(29,46,34,0.16);
      transform: translateX(100%); transition: transform .25s ease;
    }
    #plan-panel.open { transform: translateX(0); }

    #thread-col { width: 100%; }

    #sidebar-toggle { display: flex; }
    #plan-toggle { display: inline-block; }

    .panel-scrim.show {
      display: block; position: absolute; inset: 0;
      background: rgba(23,41,30,0.32); z-index: 25;
    }
  }
</style>
</head>
<body>
<!-- One persistent top nav bar spanning the whole app, same consolidation
     pattern as ../intake-app/static/session.html's .top-nav:
     brand lockup + a privacy chip on the left, instead of the brand and
     New case/Help controls living inside the sidebar's own header. -->
<div class="top-nav">
  <div class="top-bar-brand">
    <button id="sidebar-toggle" title="Cases">
      <svg width="15" height="11" viewBox="0 0 24 18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="0" y1="1" x2="24" y2="1"/><line x1="0" y1="9" x2="24" y2="9"/><line x1="0" y1="17" x2="24" y2="17"/></svg>
    </button>
    <svg class="mend-mark" width="29" height="21" viewBox="0 0 871 616" fill="#F3829A" aria-hidden="true"><path d="M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z"/></svg>
    <span class="brand-name">Seam</span>
    <span class="privacy-chip">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      Anonymity enforced
    </span>
  </div>
  <div class="top-nav-actions">
    <button id="help-btn" title="How this works">?</button>
    <button id="new-case-btn" title="New case">+</button>
  </div>
</div>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-subheader">Cases</div>
    <div id="case-list"></div>
    <div id="sidebar-footer">Names stay out of this by default.</div>
  </div>

  <div class="panel-scrim" id="panel-scrim"></div>

  <div id="thread-col">
    <div id="thread-header" style="display:none">
      <div class="name" id="thread-title"></div>
      <div class="actions">
        <button id="plan-toggle">Plan</button>
        <button id="close-case-btn">Close case</button>
      </div>
    </div>
    <div id="handoff-banner">
      <div class="title">Both sides seem to agree on the blocker</div>
      <div class="desc">Thimble thinks this is ready to hand off to a private peer session between the two people involved. The manager loses visibility once it starts.</div>
      <button id="start-handoff-btn">Start peer session</button>
      <div class="links" id="handoff-links" style="display:none"></div>
    </div>
    <div id="messages" style="display:none"></div>
    <div id="empty-state"></div>
    <div id="composer-row" style="display:none">
      <textarea id="composer" rows="1" placeholder="Message"></textarea>
      <button id="mic-btn" title="Hold to dictate">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3Z" stroke="currentColor" stroke-width="2"/><path d="M6 11a6 6 0 0 0 12 0M12 19v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="send-btn" title="Send">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M3 11L21 3L13 21L11 13L3 11Z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div id="plan-panel" style="display:none">
    <div id="incident-section">
      <div class="title">Inciting incident</div>
      <div id="incident-text"></div>
    </div>
    <div id="plan-header">
      <div class="title">Plan so far</div>
    </div>
    <div id="plan-steps"></div>
    <div id="add-step-row">
      <input id="add-step-input" placeholder="add a step">
      <button id="add-step-btn">+</button>
    </div>
  </div>
</div>

<div id="help-overlay">
  <div id="help-modal">
    <button class="close-help" title="Close">&times;</button>
    <div class="brand">
      <svg class="mend-mark" width="29" height="21" viewBox="0 0 871 616" fill="#F3829A" aria-hidden="true"><path d="M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z"/></svg>
      <span class="brand-name">Seam</span>
    </div>
    <h1>How it works</h1>
    <div id="help-modal-body"></div>
  </div>
</div>

<script>
let currentCaseId = null;
let cases = [];
let roster = {}; // "Employee A" -> descriptor, for the current case only

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

function timeAgo(ts) {
  const diff = Date.now() / 1000 - ts;
  if (diff < 60) return "now";
  if (diff < 3600) return Math.floor(diff / 60) + "m";
  if (diff < 86400) return Math.floor(diff / 3600) + "h";
  return Math.floor(diff / 86400) + "d";
}

async function loadCases() {
  const res = await fetch("/api/cases");
  cases = await res.json();
  renderCaseList();
  renderEmptyState();
}

function mendMarkSvg() {
  return `<svg width="20" height="14" viewBox="0 0 871 616" fill="currentColor" aria-hidden="true"><path d="M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z"/></svg>`;
}

function flowStepsHtml() {
  return `
    <div class="flow-steps">
      <div class="flow-step-item"><div class="n">1</div><div class="t"><b>Unpack</b> what's actually going on, beyond the first impression.</div></div>
      <div class="flow-step-item"><div class="n">2</div><div class="t"><b>Plan</b> the next concrete step together, not a canned tip list.</div></div>
      <div class="flow-step-item"><div class="n">3</div><div class="t"><b>Act</b> on it off-app, then come back and report what happened.</div></div>
      <div class="flow-step-item"><div class="n">4</div><div class="t">Loop back to planning if it's not resolved, or hand it off once both sides agree on the blocker.</div></div>
    </div>
  `;
}

function privacyNoteHtml() {
  return `<p class="privacy-note">Names stay out of it by default: everyone besides you is referred to by role. This case's notes stay in your own private workspace, no transcript, nothing HR can pull into a file.</p>`;
}

function renderEmptyState() {
  const el = document.getElementById("empty-state");
  const hasCases = cases.length > 0;
  el.className = hasCases ? "returning" : "";
  el.innerHTML = `
    <div class="wrap">
      <div class="mark">${mendMarkSvg()}</div>
      <h1>${hasCases ? "Pick a case on the left, or start a new one" : "Think through a conflict before you step into it"}</h1>
      <p class="lede">Seam is a private space for you to work out what's going on with a direct report who's in conflict, with a peer or with someone on another team, and figure out what to actually do about it. Join the people back into a working relationship, not just paper over the friction.</p>
      ${flowStepsHtml()}
      ${privacyNoteHtml()}
      <button id="empty-state-cta">${hasCases ? "Start a new case" : "Open your first case"}</button>
    </div>
  `;
  document.getElementById("empty-state-cta").onclick = createCase;
}

function openHelp() {
  const overlay = document.getElementById("help-overlay");
  document.getElementById("help-modal-body").innerHTML = `
    <p class="lede" style="margin:0 0 20px 0; font-size:13px; color:var(--muted); line-height:1.5;">A private space for you to work out what's going on with a direct report who's in conflict, with a peer or with someone on another team, and figure out what to actually do about it.</p>
    ${flowStepsHtml()}
    ${privacyNoteHtml()}
  `;
  overlay.classList.add("open");
}

function closeHelp() {
  document.getElementById("help-overlay").classList.remove("open");
}

function renderCaseList() {
  const list = document.getElementById("case-list");
  list.innerHTML = "";
  for (const c of cases) {
    const row = document.createElement("div");
    row.className = "case-row" + (c.id === currentCaseId ? " active" : "") + (c.status === "closed" ? " closed" : "");
    const name = c.title || "New case";
    const preview = c.next_action || c.last_action || c.tension_summary || "Just opened";
    row.innerHTML = `
      <div class="top"><div class="name">${escapeHtml(name)}</div><div class="time">${timeAgo(c.updated_at)}</div></div>
      <div class="preview">${escapeHtml(preview)}</div>
    `;
    row.onclick = () => openCase(c.id);
    list.appendChild(row);
  }
}

async function createCase() {
  const res = await fetch("/api/cases", { method: "POST" });
  const c = await res.json();
  cases.unshift(c);
  renderCaseList();
  await openCase(c.id, true);
}

async function openCase(caseId, isNew) {
  currentCaseId = caseId;
  renderCaseList();
  document.getElementById("empty-state").style.display = "none";
  document.getElementById("thread-header").style.display = "flex";
  document.getElementById("messages").style.display = "flex";
  document.getElementById("composer-row").style.display = "flex";
  document.getElementById("plan-panel").style.display = "flex";
  closeSidebarOnMobile();

  const res = await fetch(`/api/cases/${caseId}`);
  const data = await res.json();
  renderThread(data);

  if (isNew || data.messages.length === 0) {
    const messagesEl = document.getElementById("messages");
    const pending = appendBubble("assistant", "...", true);
    const r = await fetch(`/api/cases/${caseId}/start`, { method: "POST" });
    const body = await r.json();
    pending.remove();
    appendBubble("assistant", body.reply);
    updateCaseFromResult(body.case);
    if (body.plan) renderPlan(body.plan);
  }
}

function renderThread(data) {
  if (data.case.roster) roster = data.case.roster;
  document.getElementById("thread-title").textContent = data.case.title || "New case";
  const messagesEl = document.getElementById("messages");
  messagesEl.innerHTML = "";
  for (const m of data.messages) {
    appendBubble(m.role, m.content);
  }
  renderPlan(data.plan);
  renderHandoffBanner(data.case);
  renderIncident(data.case);
}

function renderIncident(caseObj) {
  const el = document.getElementById("incident-text");
  if (caseObj.tension_summary) {
    el.textContent = caseObj.tension_summary;
    el.classList.remove("placeholder");
  } else {
    el.textContent = "Will be added here as the case comes into focus.";
    el.classList.add("placeholder");
  }
}

async function renderHandoffBanner(caseObj) {
  const banner = document.getElementById("handoff-banner");
  banner.style.display = caseObj.handoff_ready ? "block" : "none";
  const links = document.getElementById("handoff-links");
  const startBtn = document.getElementById("start-handoff-btn");
  if (caseObj.handoff_code) {
    // Links aren't persisted on the case itself (only the room code is) --
    // re-fetch them from the idempotent handoff endpoint to redisplay.
    await startHandoff();
  } else {
    links.style.display = "none";
    startBtn.style.display = "inline-block";
  }
}

function renderHandoffLinks(caseObj) {
  const links = document.getElementById("handoff-links");
  document.getElementById("start-handoff-btn").style.display = "none";
  links.style.display = "flex";
  links.innerHTML = `
    <div class="link-row"><label>Party A</label><input readonly value="${escapeHtml(caseObj.role_a_url)}"><button data-url="${escapeHtml(caseObj.role_a_url)}">Copy</button></div>
    <div class="link-row"><label>Party B</label><input readonly value="${escapeHtml(caseObj.role_b_url)}"><button data-url="${escapeHtml(caseObj.role_b_url)}">Copy</button></div>
  `;
  for (const btn of links.querySelectorAll("button")) {
    btn.onclick = () => navigator.clipboard.writeText(btn.dataset.url);
  }
}

async function startHandoff() {
  if (!currentCaseId) return;
  const res = await fetch(`/api/cases/${currentCaseId}/handoff`, { method: "POST" });
  const body = await res.json();
  renderHandoffLinks(body);
}

function appendBubble(role, text, pending) {
  const messagesEl = document.getElementById("messages");
  const b = document.createElement("div");
  b.className = "bubble " + role + (pending ? " pending" : "");
  renderBubbleText(b, text);
  messagesEl.appendChild(b);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return b;
}

const EMPLOYEE_TAG_RE = /\bEmployee [A-Z]\b/g;

function renderBubbleText(el, text) {
  el.innerHTML = "";
  let lastIndex = 0;
  EMPLOYEE_TAG_RE.lastIndex = 0;
  let match;
  while ((match = EMPLOYEE_TAG_RE.exec(text)) !== null) {
    if (match.index > lastIndex) {
      el.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
    }
    const label = match[0];
    const tag = document.createElement("span");
    tag.className = "employee-tag";
    tag.textContent = label;
    tag.tabIndex = 0;
    tag.onclick = (e) => {
      e.stopPropagation();
      showEmployeeTooltip(tag, label);
    };
    el.appendChild(tag);
    lastIndex = match.index + label.length;
  }
  if (lastIndex < text.length) {
    el.appendChild(document.createTextNode(text.slice(lastIndex)));
  }
}

let activeEmployeeTooltip = null;

function showEmployeeTooltip(anchorEl, label) {
  closeEmployeeTooltip();
  const tip = document.createElement("div");
  tip.className = "employee-tooltip";
  tip.textContent = roster[label] || "No descriptor yet";
  document.body.appendChild(tip);
  const rect = anchorEl.getBoundingClientRect();
  tip.style.left = Math.min(rect.left, window.innerWidth - 236) + "px";
  tip.style.top = rect.bottom + 6 + "px";
  activeEmployeeTooltip = tip;
  setTimeout(() => document.addEventListener("click", closeEmployeeTooltipOnOutsideClick, { once: true }), 0);
}

function closeEmployeeTooltip() {
  if (activeEmployeeTooltip) {
    activeEmployeeTooltip.remove();
    activeEmployeeTooltip = null;
  }
}

function closeEmployeeTooltipOnOutsideClick(e) {
  if (activeEmployeeTooltip && !activeEmployeeTooltip.contains(e.target)) closeEmployeeTooltip();
}

function updateCaseFromResult(updatedCase) {
  if (updatedCase.roster) roster = updatedCase.roster;
  const idx = cases.findIndex((c) => c.id === updatedCase.id);
  if (idx >= 0) cases[idx] = updatedCase;
  else cases.unshift(updatedCase);
  cases.sort((a, b) => b.updated_at - a.updated_at);
  renderCaseList();
  document.getElementById("thread-title").textContent = updatedCase.title || "New case";
  renderHandoffBanner(updatedCase);
  renderIncident(updatedCase);
}

async function sendMessage() {
  const composer = document.getElementById("composer");
  const text = composer.value.trim();
  if (!text || !currentCaseId) return;
  composer.value = "";
  composer.style.height = "auto";
  const userBubble = appendBubble("user", text);
  document.getElementById("send-btn").disabled = true;
  const pending = appendBubble("assistant", "...", true);
  try {
    const res = await fetch(`/api/cases/${currentCaseId}/messages`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ content: text }),
    });
    const body = await res.json();
    pending.remove();
    appendBubble("assistant", body.reply);
    updateCaseFromResult(body.case);
    if (body.plan) renderPlan(body.plan);
    if (body.user_message_redacted && body.user_message_redacted !== text) {
      renderBubbleText(userBubble, body.user_message_redacted);
      const tags = userBubble.querySelectorAll(".employee-tag");
      tags.forEach((t) => t.classList.add("just-redacted"));
      setTimeout(() => tags.forEach((t) => t.classList.remove("just-redacted")), 700);
    }
  } finally {
    document.getElementById("send-btn").disabled = false;
  }
}

async function closeCase() {
  if (!currentCaseId) return;
  const res = await fetch(`/api/cases/${currentCaseId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ status: "closed" }),
  });
  const updated = await res.json();
  updateCaseFromResult(updated);
}

// --- Plan panel ---

function renderPlan(steps) {
  const container = document.getElementById("plan-steps");
  container.innerHTML = "";
  steps.forEach((s, i) => {
    container.appendChild(renderStep(s, i));
  });
}

function renderStep(s, index) {
  const wrap = document.createElement("div");
  wrap.className = "step" + (s.done ? " done" : "");

  const label = document.createElement("div");
  label.className = "step-label";
  label.textContent = `Step ${index + 1}`;
  if (s.added_by === "seam") {
    const seamTag = document.createElement("span");
    seamTag.className = "step-added-by";
    seamTag.textContent = "added by Seam";
    label.appendChild(seamTag);
  }
  wrap.appendChild(label);

  const row = document.createElement("div");
  row.className = "row";

  const check = document.createElement("div");
  check.className = "check";
  check.innerHTML = '<svg width="9" height="9" viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  check.onclick = async () => {
    const res = await fetch(`/api/cases/${currentCaseId}/plan/${s.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ done: !s.done }),
    });
    renderPlan(await res.json());
  };

  const text = document.createElement("div");
  text.className = "step-text";
  text.contentEditable = "true";
  text.textContent = s.text;
  text.onblur = async () => {
    if (text.textContent.trim() === s.text) return;
    const res = await fetch(`/api/cases/${currentCaseId}/plan/${s.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: text.textContent.trim() }),
    });
    renderPlan(await res.json());
  };

  row.appendChild(check);
  row.appendChild(text);
  wrap.appendChild(row);

  const note = document.createElement("div");
  note.className = "step-note";
  note.contentEditable = "true";
  note.dataset.placeholder = s.done ? "add a note on how it went" : "add a note when it's done";
  note.textContent = s.note || "";
  note.onblur = async () => {
    if ((note.textContent.trim() || null) === s.note) return;
    const res = await fetch(`/api/cases/${currentCaseId}/plan/${s.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note: note.textContent.trim() }),
    });
    renderPlan(await res.json());
  };
  wrap.appendChild(note);

  return wrap;
}

async function addStep() {
  const input = document.getElementById("add-step-input");
  const text = input.value.trim();
  if (!text || !currentCaseId) return;
  input.value = "";
  const res = await fetch(`/api/cases/${currentCaseId}/plan`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text }),
  });
  renderPlan(await res.json());
}

document.getElementById("new-case-btn").onclick = createCase;
document.getElementById("help-btn").onclick = openHelp;
document.querySelector("#help-modal .close-help").onclick = closeHelp;
document.getElementById("help-overlay").addEventListener("click", (e) => {
  if (e.target.id === "help-overlay") closeHelp();
});
document.getElementById("close-case-btn").onclick = closeCase;
document.getElementById("start-handoff-btn").onclick = startHandoff;
document.getElementById("send-btn").onclick = sendMessage;
document.getElementById("add-step-btn").onclick = addStep;
document.getElementById("add-step-input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") addStep();
});
const composerEl = document.getElementById("composer");
composerEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
composerEl.addEventListener("input", () => {
  composerEl.style.height = "auto";
  composerEl.style.height = composerEl.scrollHeight + "px";
});

// Push-to-talk dictation: hold the mic button, speak, release. Transcribes
// via /api/voice and appends the text into the composer -- never sends on
// its own, the manager still hits send/Enter themselves.
const micBtn = document.getElementById("mic-btn");
let mediaRecorder = null;
let recordedChunks = [];

async function micPress() {
  if (mediaRecorder) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  } catch (e) {
    alert("Couldn't access the microphone.");
    return;
  }
  recordedChunks = [];
  mediaRecorder = new MediaRecorder(stream);
  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach((t) => t.stop());
    micBtn.classList.remove("recording");
    const blob = new Blob(recordedChunks, { type: "audio/webm" });
    mediaRecorder = null;
    if (blob.size < 1000) return; // too short to be real speech
    const form = new FormData();
    form.append("file", blob, "clip.webm");
    micBtn.disabled = true;
    try {
      const res = await fetch("/api/voice", { method: "POST", body: form });
      const data = await res.json();
      if (data.transcript) {
        composerEl.value = (composerEl.value ? composerEl.value + " " : "") + data.transcript;
        composerEl.dispatchEvent(new Event("input"));
        composerEl.focus();
      }
    } catch (e) {
      // silent: dictation failing shouldn't block typing instead
    } finally {
      micBtn.disabled = false;
    }
  };
  mediaRecorder.start();
  micBtn.classList.add("recording");
}

function micRelease() {
  if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
}

micBtn.addEventListener("mousedown", (e) => { e.preventDefault(); micPress(); });
micBtn.addEventListener("mouseup", micRelease);
micBtn.addEventListener("mouseleave", micRelease);
micBtn.addEventListener("touchstart", (e) => { e.preventDefault(); micPress(); }, { passive: false });
micBtn.addEventListener("touchend", (e) => { e.preventDefault(); micRelease(); }, { passive: false });

// Mobile: cases and plan are off-canvas drawers. Cases opens by default;
// opening a case closes it so the thread is visible, and either drawer
// can be reopened from the top nav / thread header.
const MOBILE_QUERY = "(max-width: 860px)";
const sidebarEl = document.getElementById("sidebar");
const planPanelEl = document.getElementById("plan-panel");
const scrimEl = document.getElementById("panel-scrim");

function isMobile() {
  return window.matchMedia(MOBILE_QUERY).matches;
}

function updateScrim() {
  const open = !sidebarEl.classList.contains("closed") || planPanelEl.classList.contains("open");
  scrimEl.classList.toggle("show", isMobile() && open);
}

function toggleSidebar() {
  sidebarEl.classList.toggle("closed");
  if (!sidebarEl.classList.contains("closed")) planPanelEl.classList.remove("open");
  updateScrim();
}

function closeSidebarOnMobile() {
  if (isMobile()) sidebarEl.classList.add("closed");
  updateScrim();
}

function togglePlanPanel() {
  planPanelEl.classList.toggle("open");
  sidebarEl.classList.add("closed");
  updateScrim();
}

document.getElementById("sidebar-toggle").onclick = toggleSidebar;
document.getElementById("plan-toggle").onclick = togglePlanPanel;
scrimEl.onclick = () => {
  sidebarEl.classList.add("closed");
  planPanelEl.classList.remove("open");
  updateScrim();
};
updateScrim();

loadCases();
</script>
</body>
