<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Swatch (local prototype)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 871 616'%3E%3Cpath d='M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z' fill='%2317372E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#F3829A; --ink:#17372E; --ink-soft:#3C4C49; --honey:#E9B949;
    --paper:#F6F1E7; --card:#FFFFFF;
    --accent:#17372E; --accent-soft:#EAF0EC;
    --border:#17372E1F; --border-soft:#17372E14;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Manrope',-apple-system,BlinkMacSystemFont,sans-serif;}
  .wrap{max-width:680px; margin:0 auto; padding:20px 16px; display:flex; flex-direction:column; height:100vh;}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .brand{display:flex; align-items:center; gap:9px;}
  .brand svg{height:17px; width:auto; display:block;}
  .brand span{font-weight:800; font-size:16px; letter-spacing:-0.03em;}
  .brand .sub{font-weight:500; font-size:12.5px; letter-spacing:0; color:var(--ink-soft); margin-left:2px;}
  .attrib-pill{display:flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px; background:var(--accent-soft); font-size:12px; font-weight:500; color:var(--ink-soft); white-space:nowrap;}
  .attrib-pill svg{flex-shrink:0;}
  .setup{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:18px; margin-bottom:14px; display:flex; flex-direction:column; gap:12px;}
  .setup label{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.08em; opacity:.75; display:block; margin-bottom:6px;}
  .setup input{width:100%; padding:9px 11px; border:1.5px solid var(--border); border-radius:10px; font:inherit; font-size:13px; background:var(--paper); color:var(--ink);}
  .setup input:focus{outline:none; border-color:var(--ink); background:var(--card);}
  button.start{align-self:flex-start; background:var(--accent); color:var(--paper); border:none; border-radius:999px; padding:10px 20px; font:inherit; font-weight:700; cursor:pointer; font-size:13.5px;}
  button.start:hover{opacity:.9;}
  .signal{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px 11px; margin-bottom:10px; white-space:pre-wrap;}
  .thread{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:14px; padding-bottom:16px;}
  .msg-wrap{display:flex; flex-direction:column; gap:3px; max-width:80%;}
  .msg-wrap.facilitator{align-items:flex-start; align-self:flex-start;}
  .msg-wrap.person{align-items:flex-end; align-self:flex-end;}
  .msg-sender{font-size:11px; font-weight:600; opacity:.55; padding:0 4px;}
  .msg{padding:12px 15px; border-radius:14px; line-height:1.55; font-size:14.5px; white-space:pre-wrap;}
  .msg.facilitator{background:var(--paper); border:1px solid var(--border); color:var(--ink); border-bottom-left-radius:4px;}
  .msg.person{background:var(--accent); color:var(--paper); border-bottom-right-radius:4px;}
  .composer{display:flex; gap:8px; align-items:flex-end; border-top:1px solid var(--border); padding-top:14px;}
  textarea{flex:1; resize:none; border:1.5px solid var(--border); border-radius:14px; padding:11px 14px; font:inherit; font-size:14.5px; background:var(--card); color:var(--ink);}
  textarea:focus{outline:none; border-color:var(--ink);}
  button{border:1px solid var(--border); background:var(--card); color:var(--ink); border-radius:999px; padding:10px 16px; font:inherit; font-weight:700; cursor:pointer; font-size:13.5px; transition:opacity .15s, border-color .15s;}
  button:hover{border-color:var(--ink);}
  button.primary{background:var(--accent); color:var(--paper); border-color:var(--accent);}
  button.primary:hover{opacity:.9;}
  button:disabled{opacity:.5; cursor:default;}
  .status{font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:6px;}
  .notes-link{font-size:12px; color:var(--ink-soft); text-decoration:underline; cursor:pointer; background:none; border:none; padding:0; font-weight:600;}
  .notes-panel{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-bottom:12px; display:flex; flex-direction:column; gap:10px;}
  .note-card{border:1px solid var(--border-soft); border-radius:10px; padding:10px 12px;}
  .note-card .who{font-weight:700; font-size:13px;}
  .note-card .heuristic{font-family:'JetBrains Mono',monospace; font-size:10.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-top:4px;}
  .note-card .text{margin-top:6px; font-size:13.5px; line-height:1.5;}
  [hidden]{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 871 616" xmlns="http://www.w3.org/2000/svg"><path d="M611 0C754.594 0 871 116.406 871 260C871 374.199 797.374 471.201 695 506.13V260C695 213.608 657.392 176 611 176C564.608 176 527 213.608 527 260V506.13C526.335 505.903 525.672 505.672 525.009 505.439C526.312 511.588 527 517.964 527 524.5C527 575.034 486.034 616 435.5 616C384.966 616 344 575.034 344 524.5C344 517.964 344.687 511.588 345.99 505.439C345.328 505.672 344.665 505.903 344 506.13V260C344 213.608 306.392 176 260 176C213.608 176 176 213.608 176 260V506.13C73.6264 471.201 0 374.199 0 260C0 116.406 116.406 0 260 0C327.642 0 389.25 25.8309 435.5 68.166C481.75 25.8309 543.358 0 611 0Z" fill="#F3829A"></path></svg>
      <span>thimble</span>
      <span class="sub">Swatch — design crit intake</span>
    </div>
    <div class="attrib-pill">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21v-1a8 8 0 0 1 16 0v1"></path></svg>
      Posted with your name on it, once you confirm.
    </div>
  </header>

  <div class="setup" id="setup">
    <div>
      <label>Design artifact / screen name</label>
      <input id="artifactName" placeholder="e.g. Checkout flow v3">
    </div>
    <div>
      <label>Your name</label>
      <input id="reviewerName" placeholder="e.g. Sam">
    </div>
    <button class="start" id="startBtn">Start private reframing</button>
  </div>

  <button class="notes-link" id="notesToggle" hidden>View confirmed notes for this artifact →</button>
  <div class="notes-panel" id="notesPanel" hidden></div>

  <div class="signal" id="signal" hidden></div>
  <div class="thread" id="thread"></div>

  <div class="composer" id="composer" hidden>
    <textarea id="input" rows="1" placeholder="Type your reply..."></textarea>
    <button class="primary" id="sendBtn">Send</button>
  </div>
  <div class="status" id="status"></div>

  <div class="setup" id="liveSetup" hidden>
    <div style="font-weight:700; font-size:13.5px;">Live crit session</div>
    <div style="font-size:12.5px; color:var(--ink-soft);">Everyone's confirmed notes get presented and discussed together. Text only for now -- no audio yet.</div>
    <div>
      <label>Your name (as shown to the room)</label>
      <input id="liveParticipantName" placeholder="e.g. Sam">
    </div>
    <button class="start" id="liveJoinBtn">Join live session</button>
  </div>

  <div id="liveRoom" hidden>
    <div class="signal" id="liveSignal" hidden></div>
    <div class="thread" id="liveThread"></div>
    <div style="display:flex; gap:8px; margin-bottom:10px;">
      <button id="liveStartBtn">Start session</button>
    </div>
    <div class="composer" id="liveComposer">
      <textarea id="liveInput" rows="1" placeholder="Type your message to the room..."></textarea>
      <button class="primary" id="liveSendBtn">Send</button>
    </div>
    <div class="composer" id="liveAskComposer" style="margin-top:8px;">
      <textarea id="liveAskInput" rows="1" placeholder="Ask Thimble privately about the note on the floor..."></textarea>
      <button id="liveAskBtn">Ask privately</button>
    </div>
    <div class="status" id="liveStatus"></div>
  </div>
</div>

<script>
const setup = document.getElementById('setup');
const startBtn = document.getElementById('startBtn');
const artifactName = document.getElementById('artifactName');
const reviewerName = document.getElementById('reviewerName');
const thread = document.getElementById('thread');
const composer = document.getElementById('composer');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const statusEl = document.getElementById('status');
const signalEl = document.getElementById('signal');
const notesToggle = document.getElementById('notesToggle');
const notesPanel = document.getElementById('notesPanel');
let sessionId = null;

function appendMsg(sender, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + sender;
  const label = document.createElement('div');
  label.className = 'msg-sender';
  label.textContent = sender === 'facilitator' ? 'Thimble' : 'You';
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + sender;
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

function showSignal(signal) {
  if (!signal) return;
  signalEl.hidden = false;
  signalEl.textContent = signal;
}

async function send(path, body) {
  statusEl.textContent = 'thinking...';
  sendBtn.disabled = true;
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body || {}),
    });
    const data = await res.json();
    if (data.session_id) sessionId = data.session_id;
    if (data.reply) appendMsg('facilitator', data.reply);
    showSignal(data.signal);
    statusEl.textContent = '';
  } catch (e) {
    statusEl.textContent = 'error: ' + e;
  } finally {
    sendBtn.disabled = false;
  }
}

async function loadNotes() {
  const artifact = artifactName.value.trim();
  if (!artifact) return;
  const res = await fetch('/api/notes?artifact=' + encodeURIComponent(artifact));
  const data = await res.json();
  notesPanel.innerHTML = '';
  if (!data.notes || !data.notes.length) {
    notesPanel.innerHTML = '<div style="font-size:13px; color:var(--ink-soft);">No confirmed notes yet for this artifact.</div>';
  } else {
    data.notes.forEach(n => {
      const card = document.createElement('div');
      card.className = 'note-card';
      card.innerHTML = '<div class="who">' + n.reviewer_name + '</div>'
        + (n.heuristic ? '<div class="heuristic">' + n.heuristic + '</div>' : '')
        + '<div class="text">' + n.note + '</div>';
      notesPanel.appendChild(card);
    });
  }
  notesPanel.hidden = false;
}

startBtn.addEventListener('click', async () => {
  setup.hidden = true;
  composer.hidden = false;
  notesToggle.hidden = false;
  liveSetup.hidden = false;
  await send('/api/start', {
    artifact_name: artifactName.value.trim(),
    reviewer_name: reviewerName.value.trim(),
  });
  input.focus();
});

notesToggle.addEventListener('click', () => {
  if (notesPanel.hidden) {
    loadNotes();
  } else {
    notesPanel.hidden = true;
  }
});

sendBtn.addEventListener('click', async () => {
  const text = input.value.trim();
  if (!text || !sessionId) return;
  appendMsg('person', text);
  input.value = '';
  await send('/api/message', {session_id: sessionId, text});
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendBtn.click();
  }
});

// --- Live crit session (text-only group room, keyed by artifact name) ----
const liveSetup = document.getElementById('liveSetup');
const liveParticipantName = document.getElementById('liveParticipantName');
const liveJoinBtn = document.getElementById('liveJoinBtn');
const liveRoom = document.getElementById('liveRoom');
const liveThread = document.getElementById('liveThread');
const liveSignal = document.getElementById('liveSignal');
const liveStartBtn = document.getElementById('liveStartBtn');
const liveComposer = document.getElementById('liveComposer');
const liveInput = document.getElementById('liveInput');
const liveSendBtn = document.getElementById('liveSendBtn');
const liveAskInput = document.getElementById('liveAskInput');
const liveAskBtn = document.getElementById('liveAskBtn');
const liveStatus = document.getElementById('liveStatus');
let liveSocket = null;

function appendLiveMsg(sender, name, text) {
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + sender;
  const label = document.createElement('div');
  label.className = 'msg-sender';
  label.textContent = sender === 'facilitator' ? 'Thimble' : name;
  const bubble = document.createElement('div');
  bubble.className = 'msg ' + sender;
  bubble.textContent = text;
  wrap.appendChild(label);
  wrap.appendChild(bubble);
  liveThread.appendChild(wrap);
  liveThread.scrollTop = liveThread.scrollHeight;
}

liveJoinBtn.addEventListener('click', () => {
  const artifact = artifactName.value.trim();
  const name = liveParticipantName.value.trim();
  if (!artifact || !name) {
    liveStatus.textContent = 'enter both an artifact name (above) and your name first';
    return;
  }
  liveSetup.hidden = true;
  liveRoom.hidden = false;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  liveSocket = new WebSocket(proto + '//' + location.host + '/ws/live/' + encodeURIComponent(artifact) + '/' + encodeURIComponent(name));
  liveSocket.addEventListener('message', (event) => {
    const data = JSON.parse(event.data);
    if (data.type === 'joined') {
      liveStatus.textContent = data.started ? 'session already in progress' : 'joined -- waiting to start';
      if (data.started) liveStartBtn.hidden = true;
    } else if (data.type === 'thinking') {
      liveStatus.textContent = 'thinking...';
    } else if (data.type === 'message') {
      liveStatus.textContent = '';
      appendLiveMsg(data.from === 'facilitator' ? 'facilitator' : 'person', data.from, data.text);
      if (data.signal) {
        liveSignal.hidden = false;
        liveSignal.textContent = JSON.stringify(data.signal);
      }
      liveStartBtn.hidden = true;
    } else if (data.type === 'ended') {
      liveStatus.textContent = 'session ended';
      liveComposer.hidden = true;
    } else if (data.type === 'ask_received') {
      liveStatus.textContent = 'sent privately -- Thimble will answer or relay it to the room';
    } else if (data.type === 'error') {
      liveStatus.textContent = 'error: ' + data.error;
    }
  });
  liveSocket.addEventListener('close', () => {
    liveStatus.textContent = 'disconnected';
  });
});

liveStartBtn.addEventListener('click', () => {
  if (!liveSocket) return;
  liveSocket.send(JSON.stringify({type: 'start'}));
});

liveSendBtn.addEventListener('click', () => {
  const text = liveInput.value.trim();
  if (!text || !liveSocket) return;
  liveSocket.send(JSON.stringify({type: 'message', text}));
  liveInput.value = '';
});

liveInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    liveSendBtn.click();
  }
});

liveAskBtn.addEventListener('click', () => {
  const text = liveAskInput.value.trim();
  if (!text || !liveSocket) return;
  liveSocket.send(JSON.stringify({type: 'ask_private', text}));
  liveAskInput.value = '';
  liveStatus.textContent = 'sending privately...';
});

liveAskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    liveAskBtn.click();
  }
});
</script>
</body>
</html>
